.langBox{left:62.25%;top:48.35%;width:14.6%;height:19.1%} .attacks{left:15.75%;top:78.3%;width:24.1%;height:16.4%} .equip{left:41%;top:75.25%;width:11.8%;height:19.8%} .inv{left:53.55%;top:75.25%;width:13.9%;height:19.8%} .notes{left:74.15%;top:86.4%;width:15.05%;height:9%}
.atkrow{display:grid;grid-template-columns:31% 17% 20% 16% 16%;align-items:center;height:20%;overflow:hidden} .atkrow span{overflow:hidden;white-space:nowrap;padding:0 2px}
.side{display:flex;flex-direction:column;gap:9px} .side .card{padding:15px}
.mechanics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px} .mini{background:#11141b;border:1px solid #353b47;border-radius:8px;padding:10px;color:#c9c1b5} .mini b{display:block;color:#e8ded0;margin-bottom:5px}

#tip.show{display:block} #tip .k{color:var(--gold);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase} #tip h4{margin:3px 0 7px} #tip p{margin:0;color:#d0c7bb;font-size:.82rem;line-height:1.45;white-space:pre-line}

<body>
<header class="top"><nav id="nav"><div class="brand" id="brand">Campaign Codex</div><button class="btn" id="cfg">Sheet</button><button class="btn" id="refresh">Actualizar</button><span class="badge live">v2.0 · Sheet-driven</span><span class="badge" id="mode">Cargando…</span></nav></header>
<div class="hero">
  <div><div class="eyebrow" id="eyebrow"></div><h1 id="heroTitle">Campaign Codex</h1><p id="heroSubtitle"></p></div>
  <div class="panel kpis"><div class="kpi"><b id="kLvl">—</b><span>Nivel principal</span></div><div class="kpi"><b id="kXp">—</b><span>PX</span></div><div class="kpi"><b id="kAllies">—</b><span>Personajes</span></div><div class="kpi"><b id="kBase">—</b><span>Funciones base</span></div></div>
</div>
<main id="main"></main>
<div class="modal" id="modal"><div class="shell"><div class="bar"><h2 id="modalTitle"></h2><button class="btn" id="close">Cerrar ×</button></div><div class="char"><div class="sheet" id="sheet"></div><aside class="side" id="side"></aside></div></div></div>
<div id="tip"></div>
<footer id="footer">Motor visual conectado a Google Sheets y Google Drive.</footer>

<script>
const DEFAULT_SHEET_ID="1WsuHIOT0wQRd1jZcIzaBBMJCeZhwPQ0rPpQ96-aFBwg";
const TAB_NAMES=[
"config","sections","assets","characters","character_stats","character_saves","character_skills",
"character_proficiencies","character_traits","character_attacks","character_spells","character_spell_slots",
"character_equipment","relationships","history","history_rolls","npcs","bestiary","enemy_traits","base_overview",
"base_rooms","base_projects","base_protocols","faction_members","lore","mysteries","items","rules","checkpoint","changelog"
];
let DB={},DATA={},ASSETS=new Map(),CONFIG={},SECTION_CONFIG=[],TIMER=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const truth=v=>["true","1","yes","si","sí","on"].includes(norm(v));
const arr=v=>Array.isArray(v)?v:String(v||"").split(/\r?\n|;;|\s*\|\s*/).map(x=>x.trim()).filter(Boolean);
const val=v=>v===undefined||v===null||v===""?"—":v;
const number=v=>{let n=Number(String(v??"").replace(",", "."));return Number.isFinite(n)?n:null};
const modifier=v=>{let n=number(v);if(n===null)return"—";let m=Math.floor((n-10)/2);return(m>=0?"+":"")+m};
const sheetId=()=>new URLSearchParams(location.search).get("sheet")||localStorage.getItem("kazym_sheet_id")||DEFAULT_SHEET_ID;
const drive=id=>id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`:"";

function parseCSV(text){
  let rows=[],row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    let ch=text[i],next=text[i+1];
    if(ch=='"'&&quoted&&next=='"'){cell+='"';i++;continue}
    if(ch=='"'){quoted=!quoted;continue}
    if(ch==","&&!quoted){row.push(cell);cell="";continue}
    if((ch=="\n"||ch=="\r")&&!quoted){
      if(ch=="\r"&&next=="\n")i++;
      row.push(cell); if(row.some(x=>x.trim()!==""))rows.push(row); row=[];cell="";continue
    }
    cell+=ch
  }
  row.push(cell); if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows
}

function rowsToObjects(rows){
  if(!rows.length)return[];
  let headerIndex=0,best=-1;
  for(let i=0;i<Math.min(5,rows.length);i++){
    let nonEmpty=rows[i].filter(x=>String(x).trim()!=="").length;
    if(nonEmpty>best){best=nonEmpty;headerIndex=i}
  }
  let headers=rows[headerIndex].map(x=>String(x).trim());
  return rows.slice(headerIndex+1).filter(r=>r.some(x=>String(x).trim()!=="")).map(r=>{
    let o={}; headers.forEach((h,i)=>{if(h)o[h]=r[i]??""}); return o
  })
}

async function loadTab(name){
  const id=sheetId();
  const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw Error(`${name}: HTTP ${r.status}`);
  const text=await r.text();
  if(/<!doctype|<html/i.test(text))throw Error(`${name}: el Sheet no es accesible públicamente`);
  return rowsToObjects(parseCSV(text)).filter(x=>!["dm","secret","secreto","private","privado"].includes(norm(x.visibility||x.scope||"both")))
}

async function loadDB(){
  setMode("Cargando…");
  const out={};
  await Promise.all(TAB_NAMES.map(async name=>{
    try{out[name]=await loadTab(name)}catch(e){console.warn(e);out[name]=[]}
  }));
  if(!out.characters.length&&!out.history.length&&!out.assets.length)throw Error("No se pudieron leer datos del Google Sheet");
  return out
}

function group(rows,key){
  const m=new Map(); (rows||[]).forEach(r=>{let k=r[key]||"";if(!m.has(k))m.set(k,[]);m.get(k).push(r)}); return m
}
function first(rows,key){
  const m=new Map(); (rows||[]).forEach(r=>{let k=r[key]||"";if(k&&!m.has(k))m.set(k,r)}); return m
}
function configObject(rows){
  const o={};(rows||[]).forEach(r=>{if(r.key)o[r.key]=r.value});return o
}
function assetURL(assetId){
  const a=ASSETS.get(String(assetId||"").trim()); if(!a)return"";
  let id=String(a.drive_file_id||"").trim(); if(!id)return"";
  return /^https?:/i.test(id)?id:drive(id)
}
function byOrder(a,b){return (number(a.sort_order)??999)-(number(b.sort_order)??999)}
function displayName(x){return typeof x==="string"?x:(x?.name||x?.item||x?.title||"")}
function list(a){return`<ul class="list">${(a||[]).map(x=>`<li>${esc(displayName(x))}</li>`).join("")}</ul>`}

function buildData(db){
  CONFIG=configObject(db.config);
  ASSETS=new Map((db.assets||[]).filter(a=>a.asset_id).map(a=>[a.asset_id,a]));

  const stats=first(db.character_stats,"character_id");
  const saves=group(db.character_saves,"character_id");
  const skills=group(db.character_skills,"character_id");
  const profs=group(db.character_proficiencies,"character_id");
  const traits=group(db.character_traits,"character_id");
  const attacks=group(db.character_attacks,"character_id");
  const spells=group(db.character_spells,"character_id");
  const slots=group(db.character_spell_slots,"character_id");
  const equip=group(db.character_equipment,"character_id");
  const rels=group(db.relationships,"subject_id");

  const characters=(db.characters||[]).sort(byOrder).map(c=>{
    const cid=c.character_id;
    return {
      ...c,
      portrait:assetURL(c.portrait_asset_id),
      stats:stats.get(cid)||{},
      saves:saves.get(cid)||[],
      skills:(skills.get(cid)||[]).sort(byOrder),
      proficiencies:(profs.get(cid)||[]).sort(byOrder),
      traits:(traits.get(cid)||[]).sort(byOrder),
      attacks:(attacks.get(cid)||[]).sort(byOrder),
      spells:(spells.get(cid)||[]).sort(byOrder),
      spell_slots:slots.get(cid)||[],
      equipment:(equip.get(cid)||[]).sort(byOrder),
      relationships:(rels.get(cid)||[]).sort(byOrder)
    }
  });

  const history=(db.history||[]).sort(byOrder).map(h=>({...h,image:assetURL(h.image_asset_id)}));
  const bestiary=(db.bestiary||[]).sort(byOrder).map(b=>({...b,image:assetURL(b.image_asset_id)}));
  const npcs=(db.npcs||[]).sort(byOrder).map(n=>({...n,image:assetURL(n.portrait_asset_id)}));
  const items=(db.items||[]).sort(byOrder).map(i=>({...i,image:assetURL(i.image_asset_id)}));
  const base=(db.base_overview||[])[0]||{};
  base.image=assetURL(base.map_asset_id||CONFIG.base_map_asset_id);
  base.rooms=(db.base_rooms||[]).sort(byOrder);
  base.projects=(db.base_projects||[]).sort(byOrder);
  base.protocols=(db.base_protocols||[]).sort(byOrder);
  base.members=(db.faction_members||[]).sort(byOrder);

  const checkpoint={};
  (db.checkpoint||[]).sort(byOrder).forEach(r=>{if(r.key)checkpoint[r.key]=r.value});

  SECTION_CONFIG=(db.sections||[]).sort(byOrder);

  return {
    characters,history,bestiary,npcs,items,base,checkpoint,
    lore:(db.lore||[]).sort(byOrder),
    mysteries:(db.mysteries||[]).sort(byOrder),
    rules:(db.rules||[]).sort(byOrder),
    changelog:(db.changelog||[]),
    history_rolls:db.history_rolls||[],
    enemy_traits:group(db.enemy_traits,"enemy_id")
  }
}

function setMode(text,cls=""){let e=$("#mode");e.textContent=text;e.className="badge "+cls}
function cfg(k,d=""){return CONFIG[k]!==undefined&&CONFIG[k]!==""?CONFIG[k]:d}

function createSection(id,title,subtitle){
  const s=document.createElement("section");s.id=id;
  s.innerHTML=`<div class="head"><div><h2>${esc(title)}</h2><p>${esc(subtitle||"")}</p></div></div><div class="sectionBody"></div>`;
  return s
}
function sectionMeta(id,title,subtitle){
  let r=SECTION_CONFIG.find(x=>x.section_id===id);
  if(!r)return{title,subtitle,visible:true,sort_order:999};
  return{title:r.title||title,subtitle:r.subtitle||subtitle,visible:r.visible===""?true:truth(r.visible),sort_order:number(r.sort_order)??999}
}

function renderShell(){
  $("#brand").textContent=cfg("campaign_name","Campaign Codex");
  $("#eyebrow").textContent=cfg("ruleset","");
  $("#heroTitle").textContent=cfg("site_title",cfg("campaign_name","Campaign Codex"));
  $("#heroSubtitle").textContent=cfg("site_subtitle","");
  document.title=cfg("site_title","Campaign Codex")+" · v2.0";

  const defs=[
    ["characters","Personajes","Fichas del grupo y residentes"],
    ["history","Historia","Crónica completa"],
    ["npcs","PNJ","Contactos y figuras conocidas"],
    ["base","Base y facción","Instalaciones, proyectos y protocolos"],
    ["bestiary","Bestiario","Criaturas y enemigos conocidos"],
    ["lore","Lore","Culturas, lugares, religiones y organizaciones"],
    ["mysteries","Misterios","Pistas, hipótesis y preguntas abiertas"],
    ["items","Objetos","Documentos, llaves y pistas"],
    ["rules","Reglas","Reglas oficiales, opcionales y adaptaciones"],
    ["checkpoint","Checkpoint","Estado canónico para continuar"],
    ["changelog","Changelog","Historial de cambios"]
  ];
  const main=$("#main");main.innerHTML="";
  const nav=$("#nav");nav.querySelectorAll("a").forEach(x=>x.remove());

  defs.map(d=>{let m=sectionMeta(...d);return{id:d[0],...m}})
      .filter(x=>x.visible).sort((a,b)=>a.sort_order-b.sort_order).forEach(m=>{
        const s=createSection(m.id,m.title,m.subtitle);main.appendChild(s);
        const a=document.createElement("a");a.href="#"+m.id;a.textContent=m.title;nav.insertBefore(a,$("#cfg"))
      })
}

function body(id){return document.querySelector(`#${id} .sectionBody`)}

function renderCharacters(){
  const root=body("characters");if(!root)return;
  root.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><input id="characterSearch" class="search" placeholder="Buscar personaje…"></div><div class="grid avatars" id="charactersGrid"></div>`;
  const draw=()=>{
    const q=norm($("#characterSearch").value);
    const grid=$("#charactersGrid");grid.innerHTML="";

}

function traitGroups(c){
  const out={species:[],class:[],other:[]};
  (c.traits||[]).forEach(t=>{let cat=norm(t.category);if(cat==="species"||cat==="race")out.species.push(t);else if(cat==="class")out.class.push(t);else out.other.push(t)});
  return out
}
function skillsArray(c){return c.skills||[]}
function saveMap(c){return Object.fromEntries((c.saves||[]).map(x=>[String(x.ability||"").toUpperCase(),x.bonus]))}
function profList(c,cat){return(c.proficiencies||[]).filter(x=>norm(x.category)===cat).map(x=>x.name)}

const SKPOS={
"acrobacias":["sl",1],"atletismo":["sl",2],"arcanos":["sl",4],"engano":["sl",5],"historia":["sl",6],"interpretacion":["sl",7],
"intimidacion":["sl",8],"investigacion":["sl",9],"medicina":["sr",1],"naturaleza":["sr",2],"percepcion":["sr",3],"perspicacia":["sr",4],
"juego de manos":["sr",5],"sigilo":["sr",6],"supervivencia":["sr",7],"trato con animales":["sr",8]
};
function skillOverlay(c){return skillsArray(c).map(x=>{let p=SKPOS[norm(x.skill||x.name)];return p?`<span class="skill ${p[0]} sk${p[1]}">${esc(x.bonus||"")}</span>`:""}).join("")}
function saveOverlay(c){let S=saveMap(c),A=["FUE","DES","CON","INT","SAB","CAR"];return A.map((k,i)=>S[k]?`<span class="save sv${i+1}">${esc(S[k])}</span>`:"").join("")}

function tipData(o,kind,owner=""){
  o=o||{};let title=o.name||o.item||o.skill||o.title||"";
  let desc=o.technical_details||o.description||o.notes||o.public_summary||title;
  let rows=[];[["Bonificador",o.bonus||o.attack_bonus],["Daño",o.damage],["Tipo",o.damage_type||o.type],["Acción",o.action_type],["Alcance",o.range],["Duración",o.duration],["Concentración",o.concentration],["Usos",o.uses],["Recarga",o.recharge],["Estado",o.status],["Fuente",o.source||o.source_book]].forEach(x=>{if(x[1])rows.push(x)});if(owner)rows.push(["Personaje",owner]);
  return{kind,title,desc,rows}
}
function tipAttr(o,k,owner=""){return`data-tip='${esc(JSON.stringify(tipData(o,k,owner)))}' tabindex="0"`}
function techList(a,k,owner=""){return`<ul class="list">${(a||[]).map(x=>`<li class="tipTarget tipDot" ${tipAttr(x,k,owner)}>${esc(displayName(x))}</li>`).join("")}</ul>`}

function attackDisplay(a){
  const name=a.name||"";
  if(a.attack_bonus||a.damage)return{name,bonus:a.attack_bonus||"",damage:a.damage||"",type:a.damage_type||"",props:a.range||""};
  let m=name.match(/^(.*?)\s([+-]\d+)\s+[—-]\s+(.+)$/);return{name:m?m[1]:name,bonus:m?m[2]:"",damage:m?m[3]:"",type:"",props:""}
}
function attackRows(c){return(c.attacks||[]).slice(0,4).map(a=>{let p=attackDisplay(a);return`<div class="atkrow tipTarget" ${tipAttr(a,"Ataque",c.name)}><span class="fitText">${esc(p.name)}</span><span class="fitText">${esc(p.bonus)}</span><span class="fitText">${esc(p.damage)}</span><span class="fitText">${esc(p.type)}</span><span class="fitText">${esc(p.props)}</span></div>`}).join("")}

    <div class="box attacks fitBox" data-max="9" data-min="5">${attackRows(c)}</div>
    <div class="box equip fitBox" data-max="9" data-min="5">${techList(eq.slice(0,6),"Objeto",c.name)}</div>
    <div class="box inv fitBox" data-max="9" data-min="5">${techList(eq.slice(6),"Objeto",c.name)}</div>
    <div class="box notes fitBox" data-max="9" data-min="5">${esc(c.current_state||c.short_description||"")}</div>`;

  $("#side").innerHTML=`<div class="card"><div class="status">${esc(c.kind||"")} · ${esc(c.role||"")}</div><h3>${esc(c.name||"")}</h3>
    <p class="long">${esc(c.short_description||"")}</p><span class="pill">${esc(c.race||"—")}</span><span class="pill">${esc([c.class,c.subclass].filter(Boolean).join(" — ")||"—")}</span><span class="pill">Nivel ${esc(c.level||"—")}</span></div>
    <details open><summary>Historia conocida</summary><div class="body long">${esc(c.public_history||"—")}</div></details>
    ${c.personality?`<details><summary>Personalidad</summary><div class="body long">${esc(c.personality)}</div></details>`:""}
    <details open><summary>Mecánicas</summary><div class="body"><div class="mechanics">
      <div class="mini"><b>Atributos</b>FUE ${val(s.str)} (${modifier(s.str)}) · DES ${val(s.dex)} (${modifier(s.dex)}) · CON ${val(s.con)} (${modifier(s.con)}) · INT ${val(s.int)} (${modifier(s.int)}) · SAB ${val(s.wis)} (${modifier(s.wis)}) · CAR ${val(s.cha)} (${modifier(s.cha)})</div>
      <div class="mini"><b>Combate</b>CA ${val(s.ac)} · iniciativa ${val(s.initiative)} · velocidad ${val(s.speed_ft)} · PG ${val(s.hp_current)}/${val(s.hp_max)} · dados ${val(s.hit_dice)}</div>
      <div class="mini"><b>Salvaciones</b>${Object.entries(S).map(([k,v])=>`${k} ${v}`).join(" · ")||"—"}</div>
      <div class="mini"><b>Habilidades</b>${(c.skills||[]).map(x=>`${x.skill} ${x.bonus||""}`).join(" · ")||"—"}</div>
    </div></div></details>
    <details open><summary>Rasgos de especie</summary><div class="body">${techList(tg.species,"Rasgo de especie",c.name)}</div></details>
    <details open><summary>Rasgos de clase</summary><div class="body">${techList(tg.class,"Rasgo de clase",c.name)}</div></details>
    ${tg.other.length?`<details><summary>Dotes y otros rasgos</summary><div class="body">${techList(tg.other,"Rasgo",c.name)}</div></details>`:""}
    <details><summary>Habilidades</summary><div class="body">${techList(c.skills,"Habilidad",c.name)}</div></details>
    <details><summary>Idiomas y competencias</summary><div class="body"><h4>Idiomas</h4>${list(langs)}<h4>Competencias</h4>${list(profs)}</div></details>
    ${c.spells.length?`<details><summary>Conjuros</summary><div class="body">${techList(c.spells,"Conjuro",c.name)}${c.spell_slots.length?`<h4>Espacios</h4>${list(c.spell_slots.map(x=>`Nivel ${x.spell_level}: ${x.slots_current}/${x.slots_max}`))}`:""}</div></details>`:""}

function fitOne(el){
  let max=number(el.dataset.max)||parseFloat(getComputedStyle(el).fontSize)||12,min=number(el.dataset.min)||5;
  el.style.fontSize=max+"px";el.style.lineHeight="1.1";
  let size=max;
  const overflow=()=>el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;
  while(size>min&&overflow()){size-=.35;el.style.fontSize=size+"px";if(el.classList.contains("fitBox"))el.style.lineHeight=Math.max(.95,1.12-(max-size)*.015)}
}
function fitSheetText(){document.querySelectorAll("#sheet .fitText,#sheet .fitBox").forEach(fitOne)}

function showTip(t,e){
  let x=$("#tip"),r=(t.rows||[]).map(v=>`<dt>${esc(v[0])}</dt><dd>${esc(v[1])}</dd>`).join("");
  x.innerHTML=`<div class="k">${esc(t.kind)}</div><h4>${esc(t.title)}</h4><p>${esc(t.desc||"")}</p>${r?`<dl>${r}</dl>`:""}`;x.classList.add("show");posTip(e)
}
function posTip(e){let x=$("#tip");if(!x.classList.contains("show"))return;let px=e.clientX+15,py=e.clientY+15,r=x.getBoundingClientRect();if(px+r.width>innerWidth-10)px=e.clientX-r.width-15;if(py+r.height>innerHeight-10)py=innerHeight-r.height-10;x.style.left=Math.max(10,px)+"px";x.style.top=Math.max(10,py)+"px"}
document.addEventListener("mouseover",e=>{let x=e.target.closest?.("[data-tip]");if(x)try{showTip(JSON.parse(x.dataset.tip),e)}catch(_){}});
document.addEventListener("mousemove",posTip);document.addEventListener("mouseout",e=>{if(e.target.closest?.("[data-tip]"))$("#tip").classList.remove("show")});
document.addEventListener("focusin",e=>{let x=e.target.closest?.("[data-tip]");if(x)try{let r=x.getBoundingClientRect();showTip(JSON.parse(x.dataset.tip),{clientX:r.right,clientY:r.top})}catch(_){}});
document.addEventListener("focusout",()=>$("#tip").classList.remove("show"));

async function refresh(){
  try{
    $("#refresh").disabled=true;DB=await loadDB();DATA=buildData(DB);renderAll();
    setMode("Sheet vivo · "+new Date().toLocaleTimeString(),"live");
    clearInterval(TIMER);let seconds=Math.max(15,number(cfg("refresh_seconds",60))||60);TIMER=setInterval(refresh,seconds*1000)
  }catch(e){
    console.error(e);setMode("Error de Sheet","err");
    $("#main").innerHTML=`<section><div class="panel" style="padding:20px"><h2>No se pudo leer la base de datos</h2><p>${esc(e.message)}</p><p>Revisa que el Google Sheet sea accesible para cualquier persona con el enlace y vuelve a pulsar Actualizar.</p></div></section>`
  }finally{$("#refresh").disabled=false}
}

$("#cfg").onclick=()=>{let x=prompt("ID o URL del Google Sheet maestro:",sheetId());if(x===null)return;x=x.trim().replace(/^.*\/spreadsheets\/d\//,"").replace(/\/.*$/,"");if(x)localStorage.setItem("kazym_sheet_id",x);else localStorage.removeItem("kazym_sheet_id");refresh()};
$("#refresh").onclick=refresh;
$("#close").onclick=()=>{$("#modal").classList.remove("open");document.body.style.overflow=""};
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#close").click()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#close").click()});
window.addEventListener("resize",()=>{if($("#modal").classList.contains("open"))fitSheetText()});
refresh();
</script>
