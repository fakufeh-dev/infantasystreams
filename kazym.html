/* Diagnóstico visible v2.8.4 */
.diag-btn{position:relative}
.diag-btn.has-warn{border-color:#8a7440;color:#e9cf83}
.diag-btn.has-error{border-color:#8b474d;color:#ffadb4;background:#2a151a}
.diag-wrap{max-width:1440px;margin:0 auto;padding:0 18px}
.diag-panel{margin:12px 0 4px;border:1px solid #4b4350;border-radius:12px;background:#11141cee;box-shadow:0 14px 40px #0007;overflow:hidden}
.diag-panel[hidden]{display:none}
.diag-head{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid #343947;background:#171a23}
.diag-head strong{margin-right:auto}
.diag-summary{font-size:.75rem;color:#aaa297}
.diag-list{max-height:360px;overflow:auto;padding:9px}
.diag-item{padding:10px 11px;margin-bottom:7px;border-radius:8px;border:1px solid #3b414e;background:#0d1017}
.diag-item.error{border-color:#75484d;background:#1d1014}
.diag-item.warn{border-color:#75643e;background:#1b180f}
.diag-item.info{border-color:#405b6f;background:#101820}
.diag-code{display:inline-block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.68rem;padding:2px 5px;border-radius:4px;background:#0006;margin-right:7px;color:#d9d2c7}
.diag-title{font-weight:800;font-size:.82rem}
.diag-detail{margin-top:5px;color:#bbb3a8;font-size:.76rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.diag-context{margin-top:4px;color:#8f8990;font-size:.69rem;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}

/* Lazy sections v2.8.11 */
section.is-lazy .sectionBody{min-height:140px}
.lazySectionCard{
  display:flex;align-items:center;justify-content:center;gap:14px;
  min-height:140px;padding:18px;border:1px dashed #3b414e;border-radius:14px;
  background:linear-gradient(180deg,#121620 0%,#0e121a 100%);
  color:#bbb3a8;text-align:center
}
.lazySectionCard .dot{
  width:10px;height:10px;border-radius:999px;background:#7b6d55;
  box-shadow:18px 0 0 #7b6d55,-18px 0 0 #7b6d55;
  animation:lazyPulse 1.2s infinite ease-in-out
}
.lazySectionCard strong{display:block;font-size:.95rem;color:#f1eadf;margin-bottom:4px}
.lazySectionCard small{display:block;font-size:.78rem;color:#8f8990;line-height:1.45;max-width:56ch}
.sectionReadyNote{margin-top:10px;font-size:.72rem;color:#8f8990}
@keyframes lazyPulse{
  0%,100%{opacity:.35;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-2px)}
}

/* Retratos siempre completos, incluyendo Tomás */
.portrait img,.npcPortrait img,.pic img{
  object-fit:contain!important;
  object-position:center bottom!important;
}
.avatar:hover img{transform:none!important}

/* Preview ampliado al hacer hover */
#imagePreview{
  position:fixed;
  left:0;top:0;
  z-index:9998;
  width:190px;height:190px;
  display:none;
  pointer-events:none;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #9b835f;
  box-shadow:
    0 10px 30px #0008,
    inset 0 0 0 3px #0d1017cc,
    inset 0 0 22px #0005;
  background-color:#11151d;
  background-repeat:no-repeat;
  transform:translate(-50%,-50%);
}
#imagePreview.show{display:block}
#imagePreview .previewShell,
#imagePreview img,
#imagePreview .previewCaption{display:none!important}

/* En imágenes ampliables, el círculo sustituye visualmente al cursor */
img[data-zoom-bound="1"]{cursor:zoom-in}
body.imageLensActive img[data-zoom-bound="1"]{cursor:none}

/* Tomás: conservar proporción vertical real, nunca llenar el ancho */
.portrait img.fullBodyPortrait,
.pic img.fullBodyPortrait{
  width:auto!important;
  height:96%!important;
  max-width:90%!important;
  max-height:96%!important;
  object-fit:contain!important;
  object-position:center bottom!important;
  display:block!important;
  margin:auto!important;
  transform:none!important;
}


/* v2.8.15 — bestiario grande + lupa proporcional + Tomás full body */

/* Los sprites del bestiario necesitan más superficie visual */
.monster img{
  width:100%!important;
  height:220px!important;
  aspect-ratio:auto!important;
  object-fit:contain!important;
  object-position:center bottom!important;
  padding:8px!important;
  box-sizing:border-box!important;
  image-rendering:pixelated;
  background:#090a0e!important;
  border-radius:10px!important;
  margin-bottom:10px!important;
}
@media (max-width:900px){
  .monster img{height:260px!important}
}

/* Tomás: forzar el PNG vertical completo incluso si una clase antigua no se aplica */
.portrait img[alt="Tomás"],
.pic img[alt="Tomás"],
.portrait img[data-asset-alt="Tomás"],
.pic img[data-asset-alt="Tomás"]{
  width:auto!important;
  height:100%!important;
  max-width:100%!important;
  max-height:100%!important;
  object-fit:contain!important;
  object-position:center bottom!important;
  display:block!important;
  margin:0 auto!important;
  transform:none!important;
}

/* La lupa mantiene el pixel-art nítido */
#imagePreview{
  image-rendering:pixelated;
}


/* v2.8.16 — Bestiario grande + Drive original para retratos */

/* Menos columnas = retratos realmente más grandes */
#bestiary .grid{
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr))!important;
  gap:16px!important;
}

.monsterPortrait{
  width:100%;
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#090a0e;
  border-radius:10px;
  margin-bottom:12px;
  border:1px solid #252a35;
}

.monsterPortrait > img{
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:100%!important;
  object-fit:contain!important;
  object-position:center center!important;
  padding:6px!important;
  margin:0!important;
  border-radius:0!important;
  background:transparent!important;
  aspect-ratio:auto!important;
  image-rendering:pixelated;
}

/* La masa sombría puede acercarse un poco porque su fuente es horizontal */
.monsterPortrait.portalFocus > img{
  transform:scale(1.12);
  transform-origin:center center;
}

/* Tomás: el original vertical debe entrar completo en el marco */
.portrait img[alt="Tomás"],
.pic img[alt="Tomás"],
.portrait img[data-asset-alt="Tomás"],
.pic img[data-asset-alt="Tomás"]{

  white-space:normal!important;
  line-height:1.45;
  min-width:0;
}

.compactDescription.expanded .compactDescriptionText{
  display:block;
  -webkit-line-clamp:unset;

  overflow:visible;
}

.compactDescriptionToggle{
  display:none;

  padding:3px 0 0;

.compactDescriptionToggle::after{

/* v2.8.25 — Historia como línea de tiempo */
.historyTimeline{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:0;
  padding:4px 0 8px;
}

.historyTimeline::before{
  content:"";
  position:absolute;
  top:42px;
  bottom:42px;
  left:52px;
  width:2px;
  background:linear-gradient(
    180deg,
    rgba(214,188,126,.12),
    rgba(214,188,126,.58) 10%,
    rgba(121,105,155,.58) 90%,
    rgba(121,105,155,.12)
  );
  box-shadow:0 0 14px rgba(125,109,162,.14);
}

.historyTimelineItem{
  position:relative;
  margin:0 0 14px;
  background:transparent;
  border:0;
  border-radius:0;
  overflow:visible;
}

.historyTimelineItem:last-child{
  margin-bottom:0;
}

.historyTimelineItem > summary{
  position:relative;
  display:grid;
  grid-template-columns:104px minmax(0,1fr);
  gap:16px;
  align-items:center;
  min-height:104px;
  padding:0;
  list-style:none;
  cursor:pointer;
  background:transparent;
}

.historyTimelineItem > summary::-webkit-details-marker{
  display:none;
}

.historyTimelineItem > summary::before{
  content:"";
  position:absolute;
  left:46px;
  top:50%;
  width:14px;
  height:14px;
  transform:translateY(-50%);
  border-radius:50%;
  background:#d2b77a;
  border:3px solid #0e1118;
  box-shadow:0 0 0 2px rgba(210,183,122,.35),0 0 18px rgba(210,183,122,.25);
  z-index:2;
}

.historyTimelineItem[open] > summary::before{
  background:#aa91cb;
  box-shadow:0 0 0 2px rgba(170,145,203,.38),0 0 20px rgba(170,145,203,.32);
}

.historyTimelineIconWrap{
  position:relative;
  z-index:3;
  width:88px;
  height:88px;
  margin-left:8px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #454b5a;

}

.historyTimelineIconWrap img{
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center!important;
  margin:0!important;
  border:0!important;
  border-radius:0!important;
  background:#090a0e!important;
}

.historyTimelineIconFallback{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#8c96ad;
  font-size:.68rem;
  text-align:center;
  padding:8px;
}

.historyTimelineHeader{
  min-width:0;
  border:1px solid #343947;
  border-radius:14px;
  background:linear-gradient(180deg,#1b1f2afa,#141720fa);
  padding:14px 48px 14px 16px;
  position:relative;
  transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;
}

.historyTimelineItem > summary:hover .historyTimelineHeader{
  border-color:#4e5668;
  transform:translateX(2px);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}

.historyTimelineItem[open] .historyTimelineHeader{
  border-color:rgba(170,145,203,.5);

}

.historyTimelineNumber{

.historyTimelineTitle{

}

  overflow:hidden;
  text-overflow:ellipsis;

}

.historyTimelineChevron{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font-size:1rem;
  transition:transform .18s ease;
}

.historyTimelineItem[open] .historyTimelineChevron{

}

<script>
const SHEET_ID="1QSrD9vg2erPGGVyR92zSFETVOUmm8GhbKMYWRxGk2Jw"; // ÚNICA fuente: Kazym Campaign Codex MASTER
const BUILD_ID="v2.9.0-20260910-1545";
console.info("Campaign Codex MASTER Sheet:", SHEET_ID);
const TABS=["config","sections","assets","characters","character_stats","character_saves","character_skills","character_proficiencies","character_traits","character_attacks","character_spells","character_spell_slots","character_equipment","relationships","history","history_rolls","history_events","npcs","bestiary","enemy_traits","base_overview","base_rooms","base_projects","base_protocols","faction_members","base_details","lore","mysteries","items","rules","checkpoint","changelog"];

const EXPECTED_SCHEMA={
  config:["key","value"],
  sections:["section_id"],
  assets:["asset_id","local_path"],
  characters:["character_id","portrait_asset_id"],
  character_stats:["character_id"],
  character_saves:["character_id"],
  character_skills:["character_id"],
  character_proficiencies:["character_id"],
  character_traits:["character_id"],
  character_attacks:["character_id"],
  character_spells:["character_id"],
  character_spell_slots:["character_id"],
  character_equipment:["character_id"],
  relationships:["subject_id"],
  history:["chapter_id"],
  history_rolls:["chapter_id"],
  history_events:["chapter_id"],
  npcs:["npc_id"],
  bestiary:["enemy_id"],
  enemy_traits:["enemy_id"],
  base_overview:["base_id"],
  base_rooms:["base_id"],
  base_projects:["base_id"],
  base_protocols:["base_id"],
  faction_members:["base_id"],
  base_details:["base_id"],
  lore:["lore_id"],
  mysteries:["mystery_id"],
  items:["item_id"],
  rules:["rule_id"],
  checkpoint:["key"],
  changelog:["version"]
};

const ESSENTIAL_TABS=new Set(["config","assets","characters","history"]);


let DB={},DATA={},ASSETS=new Map(),CONFIG={},SECTIONS=[],TIMER=null;
let SECTION_OBSERVER=null;
const EAGER_SECTIONS=new Set(["characters"]);


let DIAGNOSTICS=[],DIAG_KEYS=new Set(),TAB_STATUS={};

function resetDiagnostics(){
  DIAGNOSTICS=[];
  DIAG_KEYS=new Set();
  TAB_STATUS={};
  renderDiagnostics();
}

function addDiag(severity,code,title,detail="",context="",dedupe=""){
  const key=dedupe||[severity,code,title,detail,context].join("|");
  if(DIAG_KEYS.has(key))return;
  DIAG_KEYS.add(key);
  DIAGNOSTICS.push({
    severity:String(severity||"warn"),
    code:String(code||"GEN"),
    title:String(title||"Problema"),
    detail:String(detail||""),
    context:String(context||""),
    time:new Date().toLocaleTimeString()
  });
  console[severity==="error"?"error":severity==="warn"?"warn":"info"](`[${code}] ${title}`,detail,context);
  renderDiagnostics();
}

function renderDiagnostics(){
  const panel=document.getElementById("diagPanel");
  const list=document.getElementById("diagList");
  const sum=document.getElementById("diagSummary");
  const btn=document.getElementById("diagToggle");
  if(!panel||!list||!sum||!btn)return;

  const errors=DIAGNOSTICS.filter(x=>x.severity==="error").length;
  const warns=DIAGNOSTICS.filter(x=>x.severity==="warn").length;
  const problems=errors+warns;

  btn.textContent=`Diagnóstico ${problems}`;
  btn.classList.toggle("has-error",errors>0);
  btn.classList.toggle("has-warn",errors===0&&warns>0);

  sum.textContent=problems
    ? `${errors} error(es) · ${warns} advertencia(s)`
    : "Sin problemas detectados";

  list.innerHTML=DIAGNOSTICS.length
    ? DIAGNOSTICS.map(d=>`
      <div class="diag-item ${esc(d.severity)}">
        <div><span class="diag-code">${esc(d.code)}</span><span class="diag-title">${esc(d.title)}</span></div>
        ${d.detail?`<div class="diag-detail">${esc(d.detail)}</div>`:""}
        ${d.context?`<div class="diag-context">${esc(d.context)}</div>`:""}
      </div>`).join("")
    : `<div class="diag-item info"><span class="diag-code">OK</span><span class="diag-title">No se han detectado problemas.</span></div>`;

  if(errors>0)panel.hidden=false;
}

function diagnosticReport(){
  const lines=[
    "KAZYM CAMPAIGN CODEX — DIAGNÓSTICO",
    `Fecha: ${new Date().toLocaleString()}`,
    `URL: ${location.href}`,
    `Sheet ID: ${SHEET_ID}`,
    "",
    ...DIAGNOSTICS.map(d=>`[${d.severity.toUpperCase()}] ${d.code} — ${d.title}\n${d.detail}${d.context?`\nContexto: ${d.context}`:""}`)
  ];
  return lines.join("\n\n");
}

function inlineAssetError(code,title,detail){
  return {
    __assetError:true,
    code:String(code||"ASSET"),

function inlineAssetErrorHTML(err){
  return `<div class="image-error-inline">
    <b>${esc(err.code||"ASSET")}</b>
    <span>${esc(err.title||"Imagen no disponible")}</span>

  </div>`;
}

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])), norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(), truth=v=>["true","1","yes","si","sí","on"].includes(norm(v)), arr=v=>Array.isArray(v)?v:String(v||"").split(/\r?\n|;;|\s*\|\s*/).map(x=>x.trim()).filter(Boolean), num=v=>{const n=Number(String(v??"").replace(",","."));return Number.isFinite(n)?n:null}, val=v=>v===undefined||v===null||v===""?"—":v, mod=v=>{const n=num(v);if(n===null)return"—";const m=Math.floor((n-10)/2);return(m>=0?"+":"")+m};
function parseCSV(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===","&&!q){r.push(c);c="";continue}if((x==="\n"||x==="\r")&&!q){if(x==="\r"&&n==="\n")i++;r.push(c);if(r.some(v=>v.trim()))R.push(r);r=[];c="";continue}c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);return R}
function normalizeHeader(v){
  return String(v||"").trim().replace(/^\ufeff/,"");
}

function rowsToObjects(name,rows){
  if(!rows.length){
    return {ok:false,headers:[],rows:[],reason:"CSV vacío"};
  }

  const expected=EXPECTED_SCHEMA[name]||[];
  const scanLimit=Math.min(8,rows.length);
  let headerIndex=-1;

  // Busca una fila que contenga TODOS los campos mínimos esperados.
  for(let i=0;i<scanLimit;i++){
    const cells=rows[i].map(normalizeHeader);
    if(expected.length && expected.every(k=>cells.includes(k))){
      headerIndex=i;
      break;
    }
  }

  // Para pestañas sin esquema explícito, usa la primera fila.
  if(headerIndex<0 && !expected.length) headerIndex=0;

  if(headerIndex<0){
    return {
      ok:false,
      headers:(rows[0]||[]).map(normalizeHeader),
      rows:[],
      reason:`No se encontró una fila de encabezados con: ${expected.join(", ")}`
    };
  }

  const headers=rows[headerIndex].map(normalizeHeader);
  const data=rows.slice(headerIndex+1)
    .filter(r=>r.some(x=>String(x||"").trim()))
    .map(r=>Object.fromEntries(
      headers.map((k,i)=>[k,r[i]??""]).filter(([k])=>k)
    ));

  return {ok:true,headers,rows:data,headerIndex};
}

async function fetchTabCSV(name,headersMode){
  const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&headers=${headersMode}&_=${Date.now()}`;

  let res;
  try{
    res=await fetch(u,{cache:"no-store"});
  }catch(e){
    const msg=String(e?.message||e||"Error de red");
    throw Object.assign(new Error(`${name}: no se pudo conectar con Google Sheets (${msg})`),{
      diagCode:"SHEET-NETWORK",
      diagTitle:"No se pudo conectar con Google Sheets",
      diagDetail:"Puede ser un problema de red, CORS, bloqueo del navegador o conexión sin Internet.",
      diagContext:`Pestaña: ${name}\n${u}`
    });
  }

  if(!res.ok){
    let code="SHEET-HTTP";
    let title=`Google Sheets respondió HTTP ${res.status}`;
    let hint="Revisa el ID del MASTER y la disponibilidad del documento.";

    if(res.status===401||res.status===403){
      code="SHEET-PERMISSION";
      title="El MASTER no permite lectura pública";
      hint="El Google Sheet debe poder leerse sin iniciar sesión.";
    }else if(res.status===404){
      code="SHEET-NOT-FOUND";
      title="No existe el MASTER o la pestaña solicitada";
      hint="Comprueba el SHEET_ID y el nombre exacto de la pestaña.";
    }else if(res.status===429){
      code="SHEET-RATE-LIMIT";
      title="Google Sheets está limitando las consultas";
      hint="Espera un momento o aumenta refresh_seconds.";
    }

    throw Object.assign(new Error(`${name}: HTTP ${res.status}`),{
      diagCode:code,diagTitle:title,diagDetail:hint,
      diagContext:`Pestaña: ${name}\n${u}`
    });
  }

  const text=await res.text();

  if(/<!doctype|<html/i.test(text)){
    throw Object.assign(new Error(`${name}: Google devolvió HTML en vez de CSV`),{
      diagCode:"SHEET-NOT-CSV",
      diagTitle:"Google no devolvió datos CSV",
      diagDetail:"Normalmente significa permisos, redirección a login o una URL de Sheet inválida.",
      diagContext:`Pestaña: ${name}\n${u}`
    });
  }

  return {text,url:u,headersMode};
}

async function tab(name){
  const attempts=[1,0];
  const failures=[];

  for(const headersMode of attempts){
    const fetched=await fetchTabCSV(name,headersMode);
    const parsed=rowsToObjects(name,parseCSV(fetched.text));

    if(parsed.ok){
      let rows=parsed.rows.filter(r=>
        !["dm","secret","secreto","private","privado"].includes(
          norm(r.visibility||r.scope||"both")
        )
      );

      TAB_STATUS[name]={
        ok:true,
        rows:rows.length,
        headers:parsed.headers,
        headerIndex:parsed.headerIndex,
        headersMode,
        schemaOk:true
      };

      if(headersMode===0){
        addDiag(
          "warn",
          "TAB-HEADER-RETRY",
          `La pestaña "${name}" necesitó reintento de encabezados`,
          "La primera lectura con headers=1 no produjo el esquema esperado; headers=0 sí funcionó.",
          `Headers finales: ${parsed.headers.join(", ")}`,
          `header-retry:${name}`
        );
      }

      return rows;
    }

    failures.push({
      mode:headersMode,
      reason:parsed.reason,
      headers:parsed.headers
    });
  }

  const expected=(EXPECTED_SCHEMA[name]||[]).join(", ");

    diagContext:failures.map(f=>`headers=${f.mode}: ${f.reason}\nRecibido: ${(f.headers||[]).join(", ")}`).join("\n\n")
  });
}

/*
  v2.8.9 — IMÁGENES DIRECTAS DESDE GOOGLE DRIVE

  Fuente única:
  assets.drive_file_id

  El MASTER guarda URLs como:
  https://lh3.googleusercontent.com/d/<FILE_ID>

  local_path se conserva solo como referencia documental; el navegador
  NO busca una carpeta assets/ en GitHub Pages.
*/
function driveId(v){
  const s=String(v||"").trim();
  if(!s)return "";
  if(/^[A-Za-z0-9_-]{20,}$/.test(s))return s;
  let m=s.match(/\/d\/([A-Za-z0-9_-]{20,})/);
  if(m)return m[1];
  m=s.match(/[?&]id=([A-Za-z0-9_-]{20,})/);
  return m?m[1]:"";
}

function drivePrimary(v){
  const raw=String(v||"").trim();
  if(!raw)return "";

  const id=driveId(raw);

  // Si la planilla contiene una URL de thumbnail de Drive, no la usamos
  // directamente: las miniaturas de Google pueden conservar recortes/caché
  // antiguos. Pedimos el archivo original.
  if(/^https?:\/\/drive\.google\.com\/thumbnail/i.test(raw) && id){
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}&v=original`;
  }

  if(/^https?:\/\//i.test(raw))return raw;
  return id?`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}`:"";
}

function driveFallbacks(v){
  const id=driveId(v);
  if(!id)return [];
  return [
    `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`,
    `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`
  ];
}

function imageUrl(v){
  if(v&&typeof v==="object"&&v.__assetError)return v;
  return String(v||"").trim();
}

function img(v,cls="",alt=""){
  const src=imageUrl(v);
  if(src&&typeof src==="object"&&src.__assetError){
    return inlineAssetErrorHTML(src);
  }
  if(!src)return "";
  const id=driveId(src);
  return `<img class="${esc(cls)}" src="${esc(src)}" alt="${esc(alt)}" data-asset-alt="${esc(alt)}" data-drive-id="${esc(id)}" data-drive-attempt="0" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
}

function queueImages(root=document){
  root.querySelectorAll("img").forEach(image=>{
    if(image.dataset.imageFallbackBound)return;
    image.dataset.imageFallbackBound="1";

    image.addEventListener("load",()=>{
      const alt=image.getAttribute("data-asset-alt")||image.alt||"";
      if(norm(alt)==="tomas"){
        addDiag(
          image.naturalHeight>image.naturalWidth?"info":"warn",
          "IMG-TOMAS-DIMS",
          "Dimensiones recibidas para Tomás",
          `El navegador recibió ${image.naturalWidth}×${image.naturalHeight}px.`,
          `src: ${image.currentSrc||image.src}`,
          `tomas-dims:${image.naturalWidth}x${image.naturalHeight}`
        );
      }
    });

    image.addEventListener("error",()=>{
      const id=image.dataset.driveId||driveId(image.getAttribute("src")||"");
      const attempt=Number(image.dataset.driveAttempt||0);
      const fallbacks=driveFallbacks(id);

      if(id && attempt < fallbacks.length){
        const next=fallbacks[attempt];
        image.dataset.driveAttempt=String(attempt+1);
        addDiag(
          "warn",
          "IMG-DRIVE-RETRY",
          `Reintentando imagen desde Google Drive`,
          `Falló el endpoint anterior. Se probará otra URL pública de Drive.`,
          `Archivo: ${image.alt||"Imagen"}\nDrive ID: ${id}\nSiguiente: ${next}`,
          `drive-retry:${id}:${attempt}`
        );
        image.src=next;
        return;
      }

      const raw=image.getAttribute("src")||"";
      const alt=image.getAttribute("data-asset-alt")||image.alt||"Imagen";
      addDiag(
        "error",
        "IMG-DRIVE-FAIL",
        `No se pudo cargar "${alt}" desde Google Drive`,
        `Se agotaron los endpoints públicos de Drive para este archivo. Revisa que el archivo siga compartido como \"Cualquiera con el enlace / lector\".`,
        `Drive ID: ${id||"no detectado"}\nÚltima URL: ${raw}`,
        `drive-fail:${id||raw}`
      );

      const box=document.createElement("div");
      box.className="image-error-inline";
      box.innerHTML=`<b>IMG-DRIVE-FAIL</b>
        <span>No se pudo cargar desde Google Drive</span>
        <span class="path">${esc(id||raw)}</span>
        <span class="hint">Revisa permisos públicos del archivo en Drive.</span>`;
      image.replaceWith(box);
    });
  });
}

const queueImagesCore=queueImages;
function bindImageZoom(root=document){
  const preview=document.getElementById("imagePreview");
  if(!preview)return;

  const LENS_SIZE=190;
  const ZOOM=2.6;

  const hideLens=()=>{
    preview.classList.remove("show");
    preview.setAttribute("aria-hidden","true");
    preview.style.backgroundImage="";
    document.body.classList.remove("imageLensActive");
  };

  const objectPositionRatio=(token,axis)=>{
    const t=String(token||"").trim().toLowerCase();
    if(t.endsWith("%")){
      const n=parseFloat(t);
      return Number.isFinite(n)?n/100:.5;
    }
    if(axis==="x"){
      if(t==="left")return 0;
      if(t==="right")return 1;
    }else{
      if(t==="top")return 0;
      if(t==="bottom")return 1;
    }
    return .5;
  };

  const renderedContentBox=image=>{
    const rect=image.getBoundingClientRect();
    const nw=image.naturalWidth||rect.width;
    const nh=image.naturalHeight||rect.height;
    if(!rect.width||!rect.height||!nw||!nh)return null;

    const cs=getComputedStyle(image);
    const fit=(cs.objectFit||"fill").toLowerCase();

    let rw=rect.width;
    let rh=rect.height;

    if(fit==="contain"||fit==="cover"||fit==="scale-down"||fit==="none"){
      let scale=1;

      if(fit==="contain"){
        scale=Math.min(rect.width/nw,rect.height/nh);
      }else if(fit==="cover"){
        scale=Math.max(rect.width/nw,rect.height/nh);
      }else if(fit==="scale-down"){
        scale=Math.min(1,Math.min(rect.width/nw,rect.height/nh));
      }else{
        scale=1;
      }

      rw=nw*scale;
      rh=nh*scale;
    }

    const pos=String(cs.objectPosition||"50% 50%").trim().split(/\s+/);
    const px=objectPositionRatio(pos[0]||"50%","x");
    const py=objectPositionRatio(pos[1]||pos[0]||"50%","y");

    const ox=(rect.width-rw)*px;
    const oy=(rect.height-rh)*py;

    return{
      rect,
      left:rect.left+ox,
      top:rect.top+oy,
      width:rw,
      height:rh
    };
  };

  const updateLens=(image,e)=>{
    const src=image.currentSrc||image.src;
    if(!src)return;

    const box=renderedContentBox(image);
    if(!box)return;

    const x=e.clientX-box.left;
    const y=e.clientY-box.top;

    // No ampliar las bandas vacías creadas por object-fit: contain.
    if(x<0||y<0||x>box.width||y>box.height){
      hideLens();
      return;
    }

    preview.style.left=`${e.clientX}px`;
    preview.style.top=`${e.clientY}px`;
    preview.style.backgroundImage=`url("${src.replace(/"/g,'\\"')}")`;

    // La proporción del PNG se conserva: nunca usamos el rectángulo exterior
    // de la tarjeta para estirar la imagen.
    preview.style.backgroundSize=`${box.width*ZOOM}px ${box.height*ZOOM}px`;

    const bgX=(LENS_SIZE/2)-(x*ZOOM);
    const bgY=(LENS_SIZE/2)-(y*ZOOM);
    preview.style.backgroundPosition=`${bgX}px ${bgY}px`;

    preview.classList.add("show");
    preview.setAttribute("aria-hidden","false");
    document.body.classList.add("imageLensActive");
  };

  root.querySelectorAll("img").forEach(image=>{
    if(image.classList.contains("bg"))return;
    if(image.closest("#history"))return;

    if(image.dataset.zoomBound==="1")return;
    image.dataset.zoomBound="1";
    image.setAttribute("data-zoom-bound","1");

    image.addEventListener("mouseenter",e=>updateLens(image,e));
    image.addEventListener("mousemove",e=>updateLens(image,e));
    image.addEventListener("mouseleave",hideLens);
  });

  window.addEventListener("blur",hideLens,{once:false});
}
queueImages=function(root=document){
  queueImagesCore(root);
  bindImageZoom(root);
};

function assetValue(assetId,opts={}){
  const key=String(assetId||"").trim();
  const context=String(opts.context||"");
  const required=!!opts.required;

  if(!key){
    if(required){
      addDiag(
        "error","ASSET-ID-EMPTY","Falta el asset_id requerido",
        "El registro no contiene portrait_asset_id, image_asset_id o map_asset_id.",
        context,`asset-empty:${context}`
      );
      return inlineAssetError("ASSET-ID-EMPTY","Falta asset_id",context||"Registro sin referencia de imagen");
    }
    return "";
  }

  const a=ASSETS.get(key);
  if(!a){
    addDiag(
      "error","ASSET-ID-NOT-FOUND",`No existe ${key} en la pestaña assets`,
      "El contenido referencia un asset_id que no está definido en el MASTER.",
      context||`asset_id: ${key}`,`asset-missing:${key}`
    );
    return inlineAssetError("ASSET-ID-NOT-FOUND",`No existe ${key}`,context);
  }

  const drive=String(a.drive_file_id||a.image_url||a.url||"").trim();
  if(!drive){
    addDiag(
      "error","ASSET-DRIVE-EMPTY",`${key} no tiene drive_file_id`,
      "Este sitio carga las imágenes directamente desde Google Drive; drive_file_id es obligatorio.",
      context||`asset_id: ${key}`,`asset-drive-empty:${key}`
    );
    return inlineAssetError("ASSET-DRIVE-EMPTY",`${key} sin URL de Drive`,context);
  }

  const src=drivePrimary(drive);
  if(!src){
    addDiag(
      "error","ASSET-DRIVE-INVALID",`${key} tiene un drive_file_id inválido`,
      "Debe ser una URL pública de Google Drive o un ID válido.",
      `drive_file_id: ${drive}`,`asset-drive-invalid:${key}`
    );
    return inlineAssetError("ASSET-DRIVE-INVALID",`${key} URL inválida`,drive);
  }

  // Tomás debe usar siempre el archivo ORIGINAL de Drive.
  // lh3/thumbnail puede entregar una rendition cuadrada de busto.
  if(key==="AST_TOMAS"){
    const originalId=driveId(drive)||driveId(a.source_drive_file_id)||"1E2A5bnf2V4bQKU0uMbdjYIxTrLBpNoMR";
    return `https://drive.google.com/uc?export=view&id=${encodeURIComponent(originalId)}&v=fullbody-${encodeURIComponent(originalId)}`;
  }

  return src;
}

modesta y un gran puesto de enlace subterráneo. Kazym juró que el puesto debe “proteger a los débiles de los injustos”. La fortaleza aceptó ese propósito y permitió reprogramar protocolos de custodia para evitar respuestas binarias o letales contra víctimas.\n\nÚLTIMO ARCO JUGADO:\nEn Control de Tránsito, el grupo eliminó una interferencia conectada por el culto al portal. Kazym preparó un ataque, esperó a que la sombra se materializara y realizó un crítico mediante flanqueo + Precisión Élfica. Pipik desmontó el dispositivo mientras Tomás estabilizaba el anillo. La sombra fue destruida, la función final se restauró y la fortaleza completó la reclamación 5/5.\n\nDespués apareció a través del enlace el HOMBRE DE LA MÁSCARA DE HUESO, herido. No atacó. Dijo que Velka también lo quiere muerto y pidió que, cuando se reencuentren, Kazym pregunte por qué. Eiravel ya había advertido a Kazym: “No mates al hombre de la máscara de hueso.”\n\nCONCLUSIÓN ACTUAL DEL GRUPO:\nEl hombre de la máscara de hueso puede ser un aliado potencial contra Velka, pero NO existe confianza todavía. Maera aconseja tratarlo como “posible aliado con demasiadas incógnitas”. Tomás cree que la sombra del portal no era controlada por él.\n\nPUNTO EXACTO PARA CONTINUAR:\nKazym, Maera, Tomás y Pipik siguen en la CÁMARA DE CONTROL DE TRÁNSITO de la base, inmediatamente después de la desaparición del hombre de la máscara de hueso y de la conversación sobre que podría ser un aliado. La base está reclamada 5/5. NO han partido todavía hacia Aguja Quebrada. NO decidir por Kazym la siguiente acción."},{"entry_id":"BIBLE_2","major_section":"2","subsection":"2","sort_order":3,"title":"2. KAZYM GARNITHOR — PERSONAJE PRINCIPAL","visibility":"both","source":"Campaign Bible v3","body":""},{"entry_id":"BIBLE_2_1","major_section":"2","subsection":"2.1","sort_order":4,"title":"2.1. IDENTIDAD Y CONCEPTO","visibility":"both","source":"Campaign Bible v3","body":"Nombre: Kazym Garnithor.\nEspecie: Shadar-kai.\nVersión racial: Mordenkainen Presents: Monsters of the Multiverse.\nClase: Pícaro.\nSubclase: Fantasma / Phantom.\nNivel: 4.\nAlineamiento: Caótico Bueno.\nTrasfondo narrativo: viajero/perseguidor de un rastro antiguo.\nPX actuales: 3.550.\nUmbral nivel 5: 6.500.\nPX faltantes: 2.950.\nBonificador de competencia: +2.\nIdiomas [RECONSTRUIDO]: Común y Élfico (dialecto Shadar-kai).\nCompetencias de armadura: armadura ligera.\nCompetencias de armas: armas simples, ballesta de mano, espada larga, estoque y espada corta.\nHerramientas: herramientas de ladrón (Pericia)."},{"entry_id":"BIBLE_2_2","major_section":"2","subsection":"2.2","sort_order":5,"title":"2.2. HISTORIA COMPLETA Y MOTIVACIONES","visibility":"both","source":"Campaign Bible v3","body":"[CANON] Kazym nació en el Shadowfell dentro de una sociedad Shadar-kai rígida, marcada por una interpretación de la Reina Cuervo que había normalizado sufrimiento, crueldad y obediencia extrema.\n\nSu madre era Shadar-kai. Durante mucho tiempo ocultó su desacuerdo profundo con la ortodoxia. Su interpretación era compasiva: una muerte natural y significativa, la preservación de la memoria, la justicia que sirve a las personas, rechazo de la muerte forzada, rechazo del uso de cadáveres o almas como herramientas y rechazo de la crueldad convertida en dogma.\n\nCon el tiempo dejó de ocultarse. Declaró que seguía el “verdadero dogma de la Reina Cuervo”. Esto la convirtió para la sociedad ortodoxa en una hereje y una amenaza profética/política.\n\nElla huyó hacia el Plano Material. Planeaba dejar a Kazym atrás para protegerlo. Subestimó cuánto había comprendido su hijo. Kazym ya consideraba rota a su sociedad y la siguió en secreto.\n\n[CANON] Kazym cree que su madre nunca supo que él la seguía. Desde entonces ha perseguido su rastro durante siglos. En el camino aprendió sigilo, lectura de personas, investigación, rastreo, supervivencia y a eliminar en silencio perseguidores que podían conducir hasta ella.\n\nLos Shadar-kai ortodoxos los persiguieron durante años, décadas y siglos. Kazym interpreta a los cazadores persistentes como un peligro no solo para él, sino como un rastro que puede conducir hasta su madre; por eso puede ser despiadado con quien continúa siguiéndolo.\n\nLa madre de Kazym no fundaba iglesias. Vivía sus principios y seguía adelante. Comunidades que la conocían repetían sus ideas, construían pequeños altares o tradiciones y preservaban frases suyas. Kazym aprende a reconocer esas “huellas doctrinales”, pero no revela que es su hijo.\n\nLa motivación de Kazym NO es exigir una explicación ni una disculpa. Quiere verla. Quiere que ella sepa que está bien, que no la odia, que entiende por qué se fue y que no cargue durante más siglos con culpa por haberlo abandonado.\n\nKazym siente una reverencia enorme hacia ella. A veces la percibe casi como profeta, elegida o figura tocada por la Reina Cuervo. No sabe con certeza si su intuición es su madre, la Reina Cuervo, memoria, deseo o algo más.\n\nLa intuición es central para Kazym. Si una intuición fuerte entra en conflicto con un plan, evidencia o consejo, tiende a darle prioridad. IMPORTANTE: el DM debe respetar esto narrativamente sin convertir la intuición en omnisciencia.\n\nMiedo espiritual mayor de Kazym: recibir una prueba irrefutable de que aquello que interpretó como mandato, señal o voz de la Reina Cuervo nunca fue real.\n\nFilosofía sobre muerte y justicia:\n- La muerte tiene significado sagrado.\n- La muerte “arrebatada” por crueldad, ambición o explotación viola el orden.\n- La no-muerte forzada y la negación del descanso son profanaciones.\n- Justicia no equivale automáticamente a ley civil.\n- La voluntad importa: una muerte justa no es “la que se quita”, sino “la que se da”, formulación aceptada por el santuario como “incompleta, pero verdadera”.\n- La libertad de elección es un eje creciente de su identidad."},{"entry_id":"BIBLE_2_3","major_section":"2","subsection":"2.3","sort_order":6,"title":"2.3. APARIENCIA FIJADA POR EL JUGADOR","visibility":"both","source":"Campaign Bible v3","body":"Piel: ceniza pálida pero oscura, gris cálido.\nCabello: negro, medio, semiondulado, con estética old-money coreana.\nOjos: café rojizo.\nRasgo distintivo: cicatriz en el labio.\nContextura: delgada, ágil, elegante, más viajero peligroso que asesino ostentoso.\nVestimenta: traje de pícaro viajero, capas oscuras y funcionales, elementos Shadar-kai discretos.\nArmas visibles: espada corta dentada y dagas dentadas.\nPresencia: sobria, silenciosa, intensa; “nobleza rota” y viajero endurecido.\n\n[IMAGEN — KAZYM PIXEL ART]"},{"entry_id":"BIBLE_2_4","major_section":"2","subsection":"2.4","sort_order":7,"title":"2.4. HOJA D&D COMPLETA","visibility":"both","source":"Campaign Bible v3","body":"PLANTILLA UNIVERSAL: la hoja pixel art mostrada aquí es una plantilla visual en blanco y reutilizable para cualquier PJ o PNJ. Los datos canónicos se mantienen en el bloque editable de texto que sigue, para poder actualizarlos sin regenerar la imagen.\n\nATRIBUTOS:\nFUE 13 (+1)\nDES 18 (+4)\nCON 15 (+2)\nINT 10 (+0)\nSAB 12 (+1)\nCAR 8 (-1)\n\nCA: 15 con armadura de cuero normal.\nIniciativa: +4.\nVelocidad: 30 pies.\nPG máximos: 31 [RECONSTRUIDO con el valor fijo de Pícaro: 8 + CON al nivel 1; +5 + CON por cada nivel 2–4].\nPG actuales al checkpoint: 31 [RECONSTRUIDO DE CONTINUIDAD]. Para cerrar la hoja sin contradicciones futuras, se fija que el regreso al pueblo tras el santuario incluyó un descanso largo antes de partir a inspeccionar la casa de guardia. Esto restaura PG y recursos que se recuperan con descanso largo; no altera ningún resultado ya jugado. El episodio del mnemófago queda registrado históricamente como 11 de daño psíquico y una curación posterior de 8 PG.\nDados de Golpe: 4d8.\nSalvaciones: DES +6, INT +2.\n\nHABILIDADES CONFIRMADAS:\nSigilo — Pericia: +8.\nPercepción — competencia: +3.\nInvestigación — competencia: +2.\nEngaño — competencia: +1.\nHerramientas de ladrón — Pericia: normalmente +8 en pruebas con Destreza.\n\n[CORRECCIÓN DE COMPETENCIA RACIAL]\nLa versión MotM del Shadar-kai otorga Percepción. Como la selección original de habilidades también registraba Percepción, existe una duplicación derivada del cambio retroactivo a la versión racial más poderosa. No inventar una sustitución silenciosa. Hasta que el jugador elija una habilidad reemplazante, mantener la hoja con Percepción una sola vez y marcar una competencia de habilidad adicional como [PENDIENTE ELECCIÓN DEL JUGADOR].\n\nATAQUES:\nEspada corta dentada: +6 al ataque, 1d6+4 perforante. Mecánicamente espada corta normal.\nDaga dentada: +6, 1d4+4 perforante, finesse/light/thrown.\nArco corto: +6, 1d6+4 perforante.\nBallesta ligera recuperada: +6, 1d8+4 perforante.\n\nATAQUE FURTIVO:\n2d6, una vez por turno, cuando se cumplen condiciones del rasgo. Puede activarse por ventaja o por presencia de enemigo del objetivo a 5 pies sin desventaja, entre otras condiciones normales. El flanqueo NO es la única vía.\n\nPERICIA:\nSigilo y herramientas de ladrón.\n\nJERGA DE LADRONES:\nConoce Thieves’ Cant.\n\nACCIÓN ASTUTA:\nAcción adicional para Correr, Destrabarse o Esconderse.\n\nSUBCLASE FANTASMA:\nSusurros de los Muertos: tras descanso corto o largo puede obtener competencia temporal en una habilidad o herramienta que no posea; puede cambiarla tras otro descanso.\nLamentos desde la Tumba: tras causar Ataque Furtivo, puede dañar a una segunda criatura visible a 30 pies del primer objetivo. Daño actual: 1d6 necrótico. Usos actuales: 2 por descanso largo (PB).\n\nDOTE NIVEL 4:\nPrecisión Élfica / Elven Accuracy.\n+1 DES ya aplicado: 17 → 18.\nCuando tiene ventaja en un ataque basado en DES/INT/SAB/CAR puede repetir uno de los d20. En mesa se ha representado como tres d20 efectivos y tomar el mejor apropiado.\n\nRASGOS SHADAR-KAI — MotM:\n- Humanoide; cuenta también como elfo para prerrequisitos/efectos que exijan ser elfo.\n- Mediano.\n- Visión en la oscuridad 60 pies.\n- Ascendencia feérica: ventaja para evitar/terminar Hechizado.\n- Sentidos Agudos: competencia en Percepción.\n- Resistencia al daño necrótico.\n- Trance: no necesita dormir; magia no puede dormirlo; descanso largo mediante 4 horas de meditación consciente.\n- Tras Trance puede obtener dos competencias temporales con armas o herramientas del PHB que no posea, hasta el siguiente descanso largo.\n- Bendición de la Reina Cuervo: acción adicional, teletransporte hasta 30 pies a espacio desocupado visible.\n- Usos de Bendición: PB por descanso largo = 2 actualmente.\n- Desde nivel 3, tras teletransportarse obtiene resistencia a TODO DAÑO hasta el inicio de su siguiente turno.\n\nCOMBINACIÓN TÁCTICA CLAVE:\nFlanqueo válido → ventaja → Precisión Élfica → Ataque Furtivo 2d6 → posible Lamentos desde la Tumba → Acción Astuta para reposicionamiento.\nLos enemigos inteligentes pueden usar flanqueo también."},{"entry_id":"BIBLE_2_5","major_section":"2","subsection":"2.5","sort_order":8,"title":"2.5. EQUIPO E INVENTARIO PERSONAL","visibility":"both","source":"Campaign Bible v3","body":"- Espada corta dentada.\n- Dos dagas dentadas.\n- Arco corto + flechas.\n- Ballesta ligera recuperada.\n- Herramientas de ladrón.\n- Armadura de cuero.\n- Equipo básico de viaje.\n- Yesquero.\n- Gancho y cuerda.\n- Dos frascos de agua bendita recibidos en la capilla, salvo consumo posterior confirmado.\n- Pergamino dejado por su madre, con mensaje y mapa/dibujo en reverso.\n- Pieza “REGRESO”, recuperable y actualmente en posesión de Kazym.\n- Pieza “CAMINO”: su manejo exacto en puertas del santuario fue ambiguo; [PENDIENTE] si sigue en inventario o quedó asociada al mecanismo.\n- Tres fragmentos de la gema/núcleo del mnemófago.\n- Pluma negra recuperada tras el mnemófago.\n- Medalla de hierro de las Agujas del Cuervo Roto: usada para abrir puerta de la base. [PENDIENTE] si fue retirada del mecanismo después.\n- Moneda negra/llave original: quedó insertada en el rito del santuario; NO narrado que Kazym la recuperara. Considerarla fuera de inventario hasta nueva escena.\n\nDINERO: [PENDIENTE DE RECONSTRUCCIÓN].\nMUNICIÓN EXACTA: [PENDIENTE].\nINSPIRACIÓN: [PENDIENTE]."},{"entry_id":"BIBLE_2_6","major_section":"2","subsection":"2.6","sort_order":9,"title":"2.6. ESTADO MECÁNICO ACTUAL — CHECKPOINT","body":"PG: 31/31 [RECONSTRUIDO DE CONTINUIDAD].\nCA 15 | Iniciativa +4 | Velocidad 30 pies | PB +2.\nPercepción pasiva 13 | Investigación pasiva 12 | Perspicacia pasiva 11.\nAtaque Furtivo: 2d6 por turno cuando se cumplen condiciones.\nBendición de la Reina Cuervo: 2/2 usos disponibles tras el descanso largo fijado antes de la base; no se registró uso posterior.\nLamentos desde la Tumba: 2/2 usos disponibles tras ese descanso; no se registró uso posterior.\nSusurros de los Muertos: competencia temporal actual [PENDIENTE — no quedó fijada tras el último descanso].\nDados de Golpe totales: 4d8; dados disponibles exactos [PENDIENTE si hubo gasto de dados antes del descanso].\nCondiciones activas: ninguna conocida al checkpoint.\nConcentración: no aplica.\nSintonización: ningún objeto sintonizado confirmado.\nRecursos sin cifra canónica todavía: dinero, munición exacta e Inspiración.","visibility":"both","source":"Campaign Bible v3"},{"entry_id":"BIBLE_3","major_section":"3","subsection":"3","sort_order":10,"title":"3. ALIADOS Y MIEMBROS DEL GRUPO","visibility":"both","source":"Campaign Bible v3","body":"REGLA:\nCada ficha separa lo que Kazym conoce de lo que solo el DM debe saber. Este documento contiene spoilers porque el usuario pidió una Campaign Bible completa. En juego, no revelar bloques SOLO DM salvo descubrimiento narrativo."},{"entry_id":"BIBLE_3_1","major_section":"3","subsection":"3.1","sort_order":11,"title":"3.1. MAERA VOSS","visibility":"dm","source":"Campaign Bible v3","body":"IDENTIDAD:\nHumana. Mujer de treinta y tantos. Pícara 3, Mente Maestra.\nRol: inteligencia, infiltración, lectura social, engaño, planificación y apoyo táctico.\n\nAPARIENCIA:\nAlta y esbelta, aprox. 1,76–1,80 m. Fibrosa, ágil.\nPiel clara, algo curtida por viaje.\nCabello muy oscuro, recogido de forma práctica.\nRostro anguloso, pómulos marcados.\nOjos grises o avellana apagados.\nCicatriz fina desde la zona de la ceja hacia la mejilla.\nArmadura ligera negra, capa gris oscura, equipo sobrio y funcional.\nPresencia: control; siempre parece medir salidas y ángulos.\n\n[IMAGEN — MAERA PIXEL ART]\n\nPERSONALIDAD OBSERVABLE:\nInteligente, estratégica, irónica, escéptica. Humor seco. Confía lentamente. Cuando decide ser leal lo demuestra mediante acciones. Prefiere información, contingencias y planes de salida.\n\nHISTORIA CONOCIDA POR KAZYM:\nFue agente de las Agujas del Cuervo Roto, red vinculada a Velka. Inicialmente antagonista. Kazym la derrotó y perdonó. Después aparecieron órdenes demostrando que el culto la consideraba desechable. Kazym la salvó del incendio de la posada y le confió la moneda negra/llave. La relación pasó de supervivencia/deuda a confianza real. Ahora acompaña voluntariamente a Kazym.\n\nRELACIÓN CON KAZYM:\nConfianza construida por decisiones mutuas. Maera es la contraparte pragmática de la intuición de Kazym. Puede discutir con él, pero ya lo considera alguien por quien asumir riesgos.\n\nHOJA COMPLETA — [DM CANON RECONSTRUIDO DESDE ESTA VERSIÓN]\nClase: Pícara 3, Mente Maestra.\nTrasfondo: Criminal/Spy adaptado.\nFUE 9 (-1), DES 16 (+3), CON 13 (+1), INT 14 (+2), SAB 12 (+1), CAR 15 (+2).\nPB +2. CA 15 (cuero tachonado oscuro). PG 21. Velocidad 30. Iniciativa +3.\nPercepción pasiva 13. Perspicacia pasiva 15.\nSalvaciones: DES +5, INT +4.\nHabilidades: Engaño +6 (Pericia), Perspicacia +5 (Pericia), Investigación +4, Percepción +3, Persuasión +4, Sigilo +5.\nHerramientas: herramientas de ladrón +5, kit de disfraz, kit de falsificación, un juego.\nCompetencias: armadura ligera; armas simples, ballesta de mano, espada larga, estoque y espada corta.\nIdiomas: Común, Jerga de Ladrones y dos idiomas adicionales de Master of Intrigue [PENDIENTE elección exacta].\nAtaque Furtivo 2d6.\nAcción Astuta.\nMente Maestra — Master of Intrigue: competencias sociales/disfraces/falsificación, imitación de habla/acento tras exposición.\nMente Maestra — Master of Tactics: puede usar Ayudar como acción adicional; a distancia 30 pies si ayuda un ataque.\nAtaques: espada corta +5 (1d6+3), daga +5 (1d4+3), arco corto +5 (1d6+3).\nEquipo: armadura ligera negra, espada corta, daga, arco, flechas, herramientas, documentación falsa, material de escritura discreto, capa gris.\n\n=== SOLO DM — NO REVELAR HASTA QUE CORRESPONDA ===\n[DM SECRETO] Nació en una ciudad comercial fronteriza.\n[DM SECRETO] Su madre, Elira Voss, era costurera y ocasionalmente ayudaba a preparar cuerpos para funerales. Elira había conocido brevemente a la madre de Kazym décadas antes del nacimiento de Maera y absorbió parte de su interpretación compasiva de la Reina Cuervo.\n[DM SECRETO] Elira enseñó a Maera ideas sobre muerte justa, descanso y que ninguna persona debe ser usada después de morir.\n[DM SECRETO] Elira murió en una crisis local donde autoridades protegieron propiedad/rutas antes de evacuar un distrito pobre. De allí nace la desconfianza de Maera hacia instituciones.\n[DM SECRETO] Maera aprendió a falsificar pases, sellos y cartas para ayudar a cruzar controles.\n[DM SECRETO] Agujas del Cuervo Roto la reclutó joven presentándose al principio como organización que preservaba nombres, memoria y reliquias de olvidados; no vio toda la verdad del culto de inmediato.\n[DM SECRETO] Se especializó en identidades falsas, chantaje, células y lectura social.\n[DM SECRETO] Su cicatriz proviene de haber salvado a una niña testigo: falsificó su muerte; un superior descubrió la mentira y la hirió. La niña sobrevivió.\n[DM SECRETO MAYOR] Años antes de conocer a Kazym, Maera transportó/autenticó un dossier que reunía rumores sobre una mujer Shadar-kai que no envejecía y un “hijo gris” que seguía su rastro. Ese dossier ayudó a organizar la persecución. Maera no conocía sus identidades entonces y todavía NO se lo ha confesado a Kazym.\nARCO INTERNO: responsabilidad sin reducirse a culpa; lealtad elegida frente a autopreservación/manipulación."},{"entry_id":"BIBLE_3_2","major_section":"3","subsection":"3.2","sort_order":12,"title":"3.2. TOMÁS","visibility":"dm","source":"Campaign Bible v3","body":"IDENTIDAD:\nHumano. Clérigo 2. Muy joven para estar de aventuras.\nEdad aparente: 16–18.\nRol: religión, rituales, investigación, curación, símbolos, anti-necromancia.\n\nAPARIENCIA:\nAprox. 1,65 m. Delgado, juvenil.\nPiel clara.\nCabello castaño desordenado.\nOjos grandes, atentos y sinceros.\nManos con tinta, polvo de libros o cera.\nTúnica clara/apagada, capa azul-gris, símbolo sagrado, libros, vendas, bolsa de estudio.\nSe ve más estudiante religioso que soldado.\n\n[IMAGEN — TOMÁS PIXEL ART]\n\nPERSONALIDAD OBSERVABLE:\nHonesto, directo, humilde, estudioso. Puede decir “no sé”. Valentía tranquila. No busca gloria. Le importa que el conocimiento útil se use. Tiene tendencia a cargar responsabilidad sobre sí.\n\nHISTORIA CONOCIDA:\nCreció ligado a la capilla y a textos religiosos. Su maestra anciana confía excepcionalmente en su juicio y permitió que acompañara a Kazym pese a su edad. Su tradición insiste en descanso correcto, dignidad de la muerte y oposición a necromancia coercitiva. Se unió antes del molino. Ha reconocido rituales, anomalías, símbolos y curado al grupo.\nCuraciones observadas: 8 PG a Kazym tras daño psíquico del mnemófago; 7 PG a Edran.\n\nHOJA COMPLETA — [DM CANON RECONSTRUIDO DESDE ESTA VERSIÓN]\nClase: Clérigo 2.\nTrasfondo [RECONSTRUIDO]: Acólito / estudiante del templo.\nDominio secreto de reglas: Tumba / Grave Domain (Xanathar). NO anunciarlo como etiqueta en ficción hasta que emerja.\nFUE 8 (-1), DES 12 (+1), CON 13 (+1), INT 15 (+2), SAB 16 (+3), CAR 10 (+0).\nPB +2. PG 15. CA 15 con protección clerical/escamas bajo ropajes; normalmente evita primera línea. Velocidad 30. Iniciativa +1.\nSalvaciones: SAB +5, CAR +2.\nHabilidades: Religión +4, Medicina +5, Perspicacia +5, Investigación +4.\nPercepción pasiva 13. Perspicacia pasiva 15.\nCD de salvación de conjuros 13. Ataque de conjuro +5.\nCompetencias: armaduras ligeras y medias, escudos, armas simples.\nIdiomas [RECONSTRUIDO]: Común, Celestial y Élfico.\nCantrips: Guidance, Sacred Flame, Thaumaturgy; Spare the Dying por dominio.\nEspacios de conjuro: 3 de nivel 1 por descanso largo.\nPreparados base sugeridos/canónicos: Cure Wounds, Healing Word, Detect Magic, Sanctuary, Protection from Evil and Good.\nConjuros de dominio: Bane, False Life.\nRasgos Grave:\n- Circle of Mortality.\n- Eyes of the Grave.\n- Channel Divinity (nivel 2): Path to the Grave, 1 uso por descanso corto/largo según reglas de Channel Divinity.\nEquipo: símbolo sagrado, libro/diario, ropas clericales, protección discreta, vendas, útiles de escritura, arma sencilla de respaldo.\n\n=== SOLO DM — NO REVELAR ===\n[DM SECRETO] Creció en una familia común alrededor del templo, ayudando con archivos, velas, copiado y funerales.\n[DM SECRETO] De niño detectó un sello funerario alterado que adultos descartaron; evitó abrir una cámara contaminada por necromancia. Su maestra empezó a confiar de forma extraordinaria en su juicio.\n[DM SECRETO] Su maestra quiere que forme juicio propio, no que repita dogma.\n[DM SECRETO] La tradición de su capilla está directa o indirectamente influida por la madre de Kazym. Tomás reconoce principios de Kazym porque ya existían en su formación, aunque NO sabe quién es la madre.\n[DM SECRETO] Inseguridad: ser “el niño” del grupo. Puede asumir riesgos para demostrar que pertenece.\n[DM SECRETO] Defecto: confunde responsabilidad con autosacrificio.\n[DM SECRETO] Su mayor miedo es tomar una decisión incorrecta cuando otros dependen de él.\nARCO: protegido prodigio → clérigo independiente capaz de discrepar con maestra, Kazym o dogma."},{"entry_id":"BIBLE_3_3","major_section":"3","subsection":"3.3","sort_order":13,"title":"3.3. PIPIK","visibility":"dm","source":"Campaign Bible v3","body":"IDENTIDAD:\nKobold adulto joven. Explorador, trampero, reparador.\nEstado: miembro provisional por acuerdo de prueba mutua.\nOrigen: Las Grietas de Cobre, al este.\n\nAPARIENCIA:\n0,90–1,05 m. Pequeño, huesudo, muy ágil.\nEscamas cobrizas/marrón rojizo, ocres.\nOjos grandes amarillo-ámbar.\nHocico corto; pequeños dientes visibles.\nCola delgada e inquieta.\nChaleco con bolsillos, herramientas, cuerda, ganchos, piezas recicladas, pequeña ballesta.\nTodo en él parece reparado/adaptado por necesidad e ingenio.\n\n[IMAGEN — PIPIK PIXEL ART]\n\nPERSONALIDAD:\nAstuto, práctico, desconfiado al principio, sarcástico y vivaz. Protector con los suyos. Usa humor para manejar tensión. Cuando habla de seguridad/familia se vuelve muy serio.\n\nHISTORIA CONOCIDA:\nParte de su gente aún vive en Grietas de Cobre; se niega a revelar ubicación exacta hasta confiar. Salió buscando caminos seguros y un lugar donde una familia pequeña pueda vivir sin ser expulsada. Llegó a la casa de guardia antes que Kazym. Vio cultistas de capas negras y un hombre de máscara de hueso vinculados al lugar. Abrió la primera trampilla y exploró parcialmente.\nKazym le prometió un lugar seguro para él y para los suyos sin exigir nada a cambio. Pipik aceptó probar la convivencia/aventuras antes de comprometer a su gente.\nKazym sintió una intuición inmediata y muy favorable hacia Pipik: lo percibe bueno, sin ambición grande, movido por proteger a los suyos.\n\nHOJA COMPLETA — [DM CANON RECONSTRUIDO DESDE ESTA VERSIÓN]\nEspecie: Kobold (MotM).\nClase: Ranger 2.\nTrasfondo [RECONSTRUIDO]: Explorador refugiado / trampero (personalizado).\nFUE 7 (-2), DES 16 (+3), CON 14 (+2), INT 13 (+1), SAB 15 (+2), CAR 10 (+0).\nPB +2. PG 20. CA 15 (cuero tachonado adaptado). Iniciativa +3. Velocidad 30.\nSalvaciones: FUE +0, DES +5.\nHabilidades: Supervivencia +4, Percepción +4, Investigación +3, Sigilo +5.\nPercepción pasiva 14.\nHerramientas de ladrón +5 por trasfondo/adaptación.\nCD de salvación de conjuros 12. Ataque de conjuro +4.\nCompetencias: armaduras ligeras y medias, escudos, armas simples y marciales.\nIdiomas [RECONSTRUIDO]: Común y Dracónico.\nRasgos kobold: Darkvision; Draconic Cry PB/LR; Kobold Legacy orientado a Craftiness.\nRanger 2014 con opcionales Tasha:\n- Favored Foe.\n- Deft Explorer / Canny (Pericia en Supervivencia).\n- Fighting Style: Archery.\n- Spellcasting nivel 2: 2 espacios nivel 1; conjuros conocidos: Goodberry, Hunter’s Mark.\nAtaques:\nPequeña ballesta/hand crossbow +7 con Archery, 1d6+3.\nDaga +5, 1d4+3.\nEquipo: ballesta pequeña, virotes, daga, herramientas de ladrón, kit de reparación/trampas, cuerda, ganchos, mochila pequeña, repuestos.\n\n=== SOLO DM ===\n[DM SECRETO] Su gente está en una situación más precaria de lo que admite; no está buscando simplemente comodidad, sino una salida antes de que su asentamiento sea descubierto/desalojado.\n[DM SECRETO] Su lealtad futura depende sobre todo de si Kazym cumple promesas de seguridad sin exigir control sobre su gente.\n[DM SECRETO] Pipik puede convertirse en eje de ingeniería/exploración de la facción y puente para una comunidad kobold, pero no debe ser forzado por “destino”.\nARCO: refugiado desconfiado → constructor de hogar / explorador principal si la confianza prospera."},{"entry_id":"BIBLE_3_4","major_section":"3","subsection":"3.4","sort_order":14,"title":"3.4. SARRIK","visibility":"dm","source":"Campaign Bible v3","body":"IDENTIDAD:\nCriatura ígnea/reptiliana pequeña. Se identifica como “Sarrik, del fuego bajo”.\nNo es demonio.\nFue prisionero de cultistas y usado como fuente térmica forzada.\nEstado: residente aliado provisional de la base por elección propia.\n\nAPARIENCIA:\nAprox. 1 m. Cuerpo reptiliano de escamas oscuras como carbón mojado. Líneas anaranjadas entre placas, como brasas internas. Ojos anaranjados. En corrupción, las líneas se vuelven verdes/púrpura y aparecen grilletes/marcas.\n\n[IMAGEN — SARRIK: LIBERADO / GUARDIÁN ÍGNEO / CORROMPIDO]\n\nPERSONALIDAD:\nDirecto, literal, sensible a la idea de libertad. Comprende conceptos mediante imágenes de fuego/cadena/hogar. Aprecia que Kazym lo liberara sin exigir servicio.\n\nHISTORIA CONOCIDA:\nLos “hombres negros” lo encadenaron al sistema térmico y lo obligaron a “comer fuego malo”, contaminándolo. Kazym abrió su abrazadera con herramientas de ladrón y ayuda de Pipik. Tomás purificó el vínculo profano. Kazym le dijo explícitamente que era libre de irse, quedarse, encender el fuego o no hacerlo. Sarrik encendió seis braseros porque quiso y decidió quedarse “por ahora”.\nFrase definitoria: “Sarrik encendió fuego porque Sarrik quiso.”\nKazym: “Si quieres irte, te vas. Si quieres volver, vuelves.”\nSarrik concluyó: “Entonces es refugio.”\n\nSTAT BLOCK ALIADO — [DM CANON RECONSTRUIDO]\nPequeño elemental. Neutral Bueno.\nCA 14. PG 22 (5d6+5). Velocidad 30, trepar 20.\nFUE 10, DES 14, CON 14, INT 8, SAB 12, CAR 10.\nResistencia: daño necrótico; inmunidad a fuego.\nSentidos: darkvision 60, passive Perception 11.\nIdiomas: Común fragmentario + lenguaje ígneo propio.\nRasgos:\n- Cuerpo de Brasa: criatura que lo golpee desarmada puede sufrir 1 fuego si Sarrik desea mantener calor defensivo.\n- Sentir Fuego: percibe fuentes de calor/fuego mágico cercano.\n- Guardián del Hogar: puede encender/extinguir llamas no mágicas pequeñas; ventaja para diagnosticar sistemas térmicos.\nAcciones:\nGarra +4, 1d6+2 cortante + 1d4 fuego.\nAscua +4, alcance 30 pies, 1d6+2 fuego.\nNo usarlo como arma automática de la facción: tiene agencia.\n\nVERSIÓN CORROMPIDA:\nLa contaminación del culto podía modificarlo. No tratar como “forma final”; representa esclavización y daño, no evolución deseada."},{"entry_id":"BIBLE_3_5","major_section":"3","subsection":"3.5","sort_order":15,"title":"3.5. BRAN","visibility":"both","source":"Campaign Bible v3","body":"IDENTIDAD:\nCuervo grande residente de la casa de guardia. Anilla de bronce con “BRAN”. No se ha establecido naturaleza mágica.\nKazym lo incluyó en “equipo Bran”.\n\nAPARIENCIA:\nCuervo grande, negro lustroso con reflejos azulados; ojos negros atentos; anilla bronce verdosa.\n\n[IMAGEN — BRAN]\n\nPERSONALIDAD OBSERVABLE:\nTerritorial, curioso, oportunista, insolente. Rivalidad cómica con Pipik.\n\nSTAT BLOCK:\nUsar Raven del Monster Manual / Basic Rules salvo evolución narrativa:\nTiny beast. CA 12. PG 1. Velocidad 10, vuelo 50.\nFUE 2, DES 14, CON 8, INT 2, SAB 12, CAR 6.\nPercepción +3, passive 13.\nMimicry.\nBeak +4, 1 piercing.\n[DM REGLA] No convertirlo en familiar mágico sin desarrollo narrativo."},{"entry_id":"BIBLE_3_6","major_section":"3","subsection":"3.6","sort_order":16,"title":"3.6. CUERVO CONSTRUCTO","visibility":"dm","source":"Campaign Bible v3","body":"IDENTIDAD:\nAntiguo mensajero mecánico de la Sala del Cuervo. Ala dañada al hallarlo; reparado parcialmente por Pipik. Funciona como nodo de mensajería y conexión con el Archivo de Tránsito.\n\nAPARIENCIA:\nCuervo mecánico de metal oscuro y bronce, lente roja en un ojo, tubos de mensajes, ala articulada. Versión dañada: piezas faltantes y ala caída. Versión reparada: postura erguida, ala operativa, mecanismos estabilizados.\n\n[IMAGEN — CUERVO CONSTRUCTO DESTRUIDO / REPARADO]\n\nSTAT BLOCK DE UTILIDAD — [DM CANON RECONSTRUIDO]\nTiny construct. CA 15. PG 10. Velocidad 10, vuelo 40 (cuando reparación esté completa puede subir a 50).\nFUE 4, DES 15, CON 12, INT 6, SAB 12, CAR 5.\nDarkvision 60.\nInmunidades de condición típicas de constructo según juicio del DM: poisoned; no necesita respirar/comer/dormir.\nPeck +4, 1d4+2 perforante.\nFunciones:\n- Nodo de mensajería.\n- Cilindros de mensaje.\n- Memoria de rutas antiguas limitada.\n- Enlace con Archivo de Tránsito cuando la base está operativa.\nNo es una criatura ofensiva primaria."},{"entry_id":"BIBLE_3_7","major_section":"3","subsection":"3.7","sort_order":17,"title":"3.7. FUTUROS MIEMBROS","visibility":"both","source":"Campaign Bible v3","body":"SERAHK:\n[CANON DE DISEÑO] Mujer aasimar, candidata futura de primera línea/protección. Todavía NO presentada. Hoja, historia y reclutamiento deben permanecer secretos y surgir orgánicamente.\n\nREGLA DE RECLUTAMIENTO:\nNadie se une automáticamente por “ser candidato”. El personaje puede negarse. Kazym puede observar, invitar, entrenar, proteger, rechazar o mantenerlo como contacto."},{"entry_id":"BIBLE_4","major_section":"4","subsection":"4","sort_order":18,"title":"4. BASE Y FACCIÓN","visibility":"both","source":"Campaign Bible v3","body":""},{"entry_id":"BIBLE_4_1","major_section":"4","subsection":"4.1","sort_order":19,"title":"4.1. IDENTIDAD","visibility":"both","source":"Campaign Bible v3","body":"Nombre formal de facción: [PENDIENTE].\nEstado: célula naciente con base funcional.\nFundador/custodio: Kazym Garnithor.\nPropósito declarado de la base: “proteger a los débiles de los injustos.”\nFilosofía emergente: protección, juicio contextual, libertad, no convertir víctimas en enemigos por defecto, información compartimentada, resistencia a Velka."},{"entry_id":"BIBLE_4_2","major_section":"4","subsection":"4.2","sort_order":20,"title":"4.2. NÚCLEO Y ROLES","visibility":"both","source":"Campaign Bible v3","body":"Kazym — custodio, líder de campo, decisiones estratégicas finales personales.\nMaera — inteligencia, operaciones, infiltración, evaluación de reclutas, contraespionaje.\nTomás — rituales, archivo religioso, atención médica, investigación de necromancia y contaminación.\nPipik — ingeniería, reparación, trampas, exploración, rutas, mantenimiento.\nSarrik — residente aliado; sistemas térmicos por elección propia, no por obligación.\nBran — observación informal / presencia residente.\nCuervo constructo — mensajería y archivo de rutas.\nEdran — contacto protegido, no miembro; agrimensura/caminos.\nSacerdotisa — contacto local y legitimidad comunitaria inicial.\nConsejo local — cooperación limitada."},{"entry_id":"BIBLE_4_3","major_section":"4","subsection":"4.3","sort_order":21,"title":"4.3. SUPERFICIE DE LA BASE","visibility":"both","source":"Campaign Bible v3","body":"- Muro perimetral bajo de piedra.\n- Patio central.\n- Pozo.\n- Establo pequeño, reparable.\n- Torre principal de dos plantas parcialmente dañada.\n- Edificio lateral con techo hundido.\n- Sendero principal y bosque.\n- Acceso a sótano/trampilla bajo torre.\n- Un antiguo guardián alterado junto a la puerta inferior.\n\n[IMAGEN — MAPA / PLANO DE LA BASE EN SU PRIMERA INSPECCIÓN. Es una instantánea histórica: posteriormente se descubrieron y restauraron Custodia Interior y Control de Tránsito hasta completar 5/5.]"},{"entry_id":"BIBLE_4_4","major_section":"4","subsection":"4.4","sort_order":22,"title":"4.4. COMPLEJO SUBTERRÁNEO","visibility":"both","source":"Campaign Bible v3","body":"Sala central:\nGran rueda/mecanismo, cisterna, tuberías de cobre y nodo del puesto.\n\nSala del Escudo:\nRefugio/custodia. Allí fue rescatado Edran.\n\nSala de la Llama:\nSistema térmico. Sarrik estaba encadenado. Contaminación eliminada. Función restaurada.\n\nSala del Cuervo:\nMensajería. Cuervo constructo reparado. Conecta con Archivo de Tránsito.\n\nArchivo de Tránsito:\nMiles de ranuras/cilindros. El cilindro marcado CAMINO se abrió usando pieza REGRESO y confirmó destino AGUJA QUEBRADA / CAMINO DE CENIZA.\n\nCustodia Interior:\nCinco filtros: RECUERDO, CUERPO, NOMBRE, VOLUNTAD, SOMBRA. Kazym reprogramó protocolos.\n\nControl de Tránsito:\nAnillo/portal de piedra negra. Interferencia cultista eliminada. Ruta original a Aguja Quebrada restaurada. Lugar donde apareció el hombre de máscara de hueso."},{"entry_id":"BIBLE_4_5","major_section":"4","subsection":"4.5","sort_order":23,"title":"4.5. CINCO FUNCIONES RESTAURADAS","visibility":"both","source":"Campaign Bible v3","body":"1/5 — Custodia inicial / reconocimiento de propósito.\n2/5 — Función térmica / Sala de la Llama.\n3/5 — Mensajería + archivo / Sala del Cuervo.\n4/5 — Custodia Interior.\n5/5 — Control de Tránsito.\nResultado: “Reclamación completada. Custodio reconocido: Kazym Garnithor.”"},{"entry_id":"BIBLE_4_6","major_section":"4","subsection":"4.6","sort_order":24,"title":"4.6. PROTOCOLOS DE CUSTODIA PROGRAMADOS POR KAZYM","visibility":"both","source":"Campaign Bible v3","body":"PRINCIPIO RECTOR:\nProteger antes de destruir.\n\nVOLUNTAD:\nAusencia de voluntad NO constituye culpa.\nDominado, engañado, coaccionado o privado de libertad → PROTEGER / CONTENER.\nHostilidad confirmada con intención de esclavizar, profanar, dañar o someter → RECHAZAR/CONTENER.\nIntención indeterminada → DETENER HASTA JUICIO.\n\nNOMBRE:\nOcultar identidad ≠ culpa automática.\nNombre/identidad ocultos + intención indeterminada → RETENER PARA JUICIO.\nIdentidad falsa + hostilidad confirmada → RECHAZAR.\n\nRECUERDO:\nPortar recuerdos ajenos → ADMITIR.\nActivar ALARMA SILENCIOSA al custodio/delegado.\nSin intervención automática.\n\nCUERPO:\nAlteración corporal no natural → RETENER.\nNo exterminar automáticamente.\nEvaluar coerción, contaminación y voluntad.\nSi víctima → PROTEGER/TRATAR.\nFuerza letal solo si contención falla y existe peligro inmediato.\n\nSOMBRA / NATURALEZA INCIERTA:\nForma, identidad o naturaleza no determinable → RETENER + ALARMA SILENCIOSA.\nNo hostilizar automáticamente.\nEvaluación obligatoria por custodio/delegado.\nConfirmada víctima/no hostil → proteger/admitir.\nConfirmada amenaza → contener/rechazar.\n\nGUARDIÁN DE SEIS DEDOS:\nLa fortaleza lo reclasificó bajo PROTECCIÓN/CONTENCIÓN:\nalteración corporal confirmada, voluntad autónoma indeterminada, coerción externa probable. Exterminio automático desactivado. Debe ser evaluado/tratado si es posible."},{"entry_id":"BIBLE_4_7","major_section":"4","subsection":"4.7","sort_order":25,"title":"4.7. RECURSOS Y EXPANSIÓN","visibility":"both","source":"Campaign Bible v3","body":"[PENDIENTE DE CUANTIFICAR]\n- Tesorería.\n- Suministros.\n- Moral.\n- Renombre.\n- Costos de reparación.\n- Capacidad de alojamiento.\n- Taller de Pipik.\n- Enfermería/archivo de Tomás.\n- Red de mensajería.\n- Defensas exteriores.\n- Habitaciones para residentes.\n- Potencial refugio de la gente de Pipik.\n\nREGLA:\nNo inventar cifras retroactivas. Cuando empiece la gestión formal, establecer costos/tiempos mediante DMG 2014 + herramientas de downtime + inspiración Bastions 2024."},{"entry_id":"BIBLE_4_8","major_section":"4","subsection":"4.8","sort_order":26,"title":"4.8. PROGRESO DE BASE Y FACCIÓN","visibility":"both","source":"Campaign Bible v3","body":"FASE 0 — Núcleo informal: COMPLETADA. Kazym, Maera y Tomás operaban como célula móvil.\nFASE 1 — Base encontrada y asegurada: COMPLETADA. Casa de guardia reclamada; funciones subterráneas 5/5 restauradas; Kazym reconocido como custodio.\nFASE 2 — Habitabilidad y reparación: ACTIVA. Prioridades: torre, establo, edificio lateral, alojamiento, taller de Pipik, espacio médico/archivo para Tomás y revisión del guardián de seis dedos.\nFASE 3 — Legitimidad local y red de apoyo: INICIADA. Contactos: sacerdotisa, consejo, Edran y posibles residentes/refugiados.\nFASE 4 — Red operativa: PENDIENTE. Mensajería, agentes externos, inteligencia, rutas seguras, rotación de miembros y misiones paralelas.\nFASE 5 — Organización consolidada: PENDIENTE. Nombre formal, estructura interna, tesorería, reputación, instalaciones especializadas y doctrina de actuación.\n\nINDICADORES A MANTENER EN CADA CHECKPOINT:\n- Funciones de la base: 5/5.\n- Integridad estructural exterior: parcial / en reparación.\n- Habitabilidad: limitada pero utilizable.\n- Seguridad interna: operativa con protocolos de custodia reprogramados.\n- Red de mensajería: operativa a nivel local; rutas mayores por desarrollar.\n- Tesorería: pendiente de cuantificación.\n- Suministros: pendiente de cuantificación.\n- Renombre: local y naciente.\n- Residentes/miembros: registrar altas, bajas y estado.\n- Proyectos activos: registrar responsable, costo, tiempo y resultado."},{"entry_id":"BIBLE_4_9","major_section":"4","subsection":"4.9","sort_order":27,"title":"4.9. OPERACIONES DE FACCIÓN","visibility":"both","source":"Campaign Bible v3","body":"La facción puede realizar tareas aunque Kazym no esté:\n- vigilancia;\n- investigación;\n- mensajería;\n- reparación;\n- búsqueda de suministros;\n- inteligencia;\n- infiltración;\n- protección;\n- reclutamiento;\n- entrenamiento;\n- misiones secundarias;\n- diplomacia local.\n\nPNJ fuera de la party siguen viviendo, relacionándose y tomando decisiones. Pueden fallar, herirse, descubrir información o crear conflictos. No congelarlos."},{"entry_id":"BIBLE_5","major_section":"5","subsection":"5","sort_order":28,"title":"5. CRÓNICA COMPLETA DE LA CAMPAÑA","visibility":"both","source":"Campaign Bible v3","body":""},{"entry_id":"BIBLE_5_1","major_section":"5","subsection":"5.1","sort_order":29,"title":"5.1. CREACIÓN DE KAZYM Y PRIMERA MISIÓN — POSADA CUBIERTA DE CENIZA","visibility":"both","source":"Campaign Bible v3","body":"Kazym fue creado como Shadar-kai pícaro, priorizando Destreza, luego Constitución y Fuerza. Sus valores quedaron FUE 13, DES 17 inicial, CON 15, INT 10, SAB 12, CAR 8. Se eligieron Sigilo, Percepción, Investigación y Engaño. Más tarde la versión MotM de Shadar-kai obligó a marcar una duplicación pendiente en Percepción.\n\nEn la posada, Kazym exploró antes de entrar. Tres ocupantes armados retenían al posadero y a un joven. Detectó y desactivó un sistema de alarma/campana en el sótano. Eliminó silenciosamente a Rusk y Bren. Combatió a Maera Voss y eligió reducirla/no matarla.\n\nLlegó un segundo grupo hostil: dos humanos, un Heraldo enmascarado y un “sabueso de duelo”. Kazym utilizó el entorno y el fuego como trampa, evacuó inocentes, disparó desde posiciones favorables, salvó a Maera del incendio y mató al Heraldo que escapaba.\n\nObjetos recuperados: máscara blanca, medallón de hierro, dinero, órdenes.\nOrden crítica:\n“Traigan al Shadar-kai vivo.\nLa llave debe permanecer con él hasta el molino.\nSi Maera falla, córtenle la lengua y quemen su nombre.\nLa luna negra se acerca.”\n\nKazym dio dinero al posadero para reconstrucción. La moneda negra encontrada antes entre una caravana masacrada fue interpretada como “llave”. Kazym la confió a Maera, un gesto central en su relación."},{"entry_id":"BIBLE_5_2","major_section":"5","subsection":"5.2","sort_order":30,"title":"5.2. PUEBLO Y CAPILLA","visibility":"both","source":"Campaign Bible v3","body":"Tras descansar, Kazym subió a nivel 2. Maera guio al grupo hacia un pueblo con una capilla vieja. Allí conocieron a una sacerdotisa anciana. Kazym reconoció en sus enseñanzas trazos del pensamiento de su madre.\n\nLa sacerdotisa ofreció ayuda sagrada, agua bendita y presentó a Tomás. Tomás se unió porque su maestra confiaba profundamente en su juicio, pese a su juventud."},{"entry_id":"BIBLE_5_3","major_section":"5","subsection":"5.3","sort_order":31,"title":"5.3. MOLINO","visibility":"both","source":"Campaign Bible v3","body":"El grupo atacó el molino mediante sigilo y coordinación. Kazym y Maera eliminaron guardias silenciosamente; Tomás se mantuvo atrás hasta que el ritual requirió apoyo.\n\nInterrumpieron un ritual del culto, rescataron a una prisionera y capturaron un cultista vivo. Recuperaron:\n- libro de cuentas cifrado;\n- cartas selladas;\n- mapa con puntos marcados;\n- anillo de sello;\n- llave extraña.\nLos documentos demostraron múltiples células.\n\nEn las ruinas/camino secreto bajo el molino el grupo enfrentó una criatura necrótica/espectral de anatomía alterada, posteriormente representada visualmente como el “Espectro del Corazón Carmesí”. [RECONSTRUIDO] El bloque exacto original no quedó archivado; ver Bestiario.\n\nDespués del molino se formó un consejo local. Kazym alcanzó 2.600 PX y subió a Pícaro 3 Fantasma. Maera quedó Pícara 3 Mente Maestra; Tomás continuó Clérigo 2.\n\nDespertar Fantasma: en la capilla apareció una pluma negra que se disolvió en sombra y se fusionó con Kazym. No resolver explicación."},{"entry_id":"BIBLE_5_4","major_section":"5","subsection":"5.4","sort_order":32,"title":"5.4. GRANERO Y SANTUARIO ANTIGUO","visibility":"both","source":"Campaign Bible v3","body":"Huellas frescas con ceniza condujeron a un granero cubierto de hiedra. Dentro había varias figuras armadas y un anciano atado; una mujer portaba un relicario ennegrecido. Frases escuchadas:\n“El Cuervo ya pasó.”\n“Si el heredero sigue vivo, encuéntrenlo antes que ella.”\n\nKazym, Maera y Tomás encontraron una entrada trasera con alarma de hilo/cabello y la sortearon sin romperla. Descendieron por escaleras antiguas.\n\nOyeron:\n“¿Por qué insiste en que el Cuervo lo eligió?”\n“Porque alguien le enseñó a reconocer las señales correctas… pero eso no significa que entienda a quién pertenecen.”\n“¿Y si el hijo ya encontró el camino?”\n“Entonces no lo toquen. Todavía no. Velka lo quiere vivo.”\n\nEncontraron una puerta funeraria/protectora anterior al culto, diseñada para impedir interferencia con muertos y descanso. La moneda negra encajaba en una depresión. Kazym autorizó con gesto; Maera insertó la moneda y el grupo entró. Maera la recuperó antes de que esa primera puerta se cerrara.\n\nEn el santuario: nichos funerarios, estatua femenina sin rostro con cuervo de piedra, una pluma negra real y sonido de campana. Kazym tocó la pluma, lloró y dijo “Madre… tú…”, siguiendo un pasaje oculto."},{"entry_id":"BIBLE_5_5","major_section":"5","subsection":"5.5","sort_order":33,"title":"5.5. EIRAVEL Y PRUEBA DEL SANTUARIO","visibility":"both","source":"Campaign Bible v3","body":"En una cámara privada: cuenco de obsidiana, tela oscura, espejo negro que reflejaba niebla. Apareció una silueta femenina.\n\nKazym creyó que podía ser su madre. Ella dijo:\n“Te demoraste. Pero llegaste.”\n“No siempre [te protegí]… hubo noches en las que estabas solo, y aun así seguiste caminando.”\n“No hagas de cada paso que diste la obra de otro. Algunos fueron tuyos.”\n\nNo dio un nombre verdadero; dijo que alguien una vez la llamó EIRAVEL y Kazym podía usar ese nombre.\n\nAdvertencia central:\n- usar la pluma como testimonio, no llave;\n- hablar con palabras propias sobre la muerte;\n- NO MATAR AL HOMBRE DE LA MÁSCARA DE HUESO;\n- confiar en lo que Kazym es, no solo en aquello que cree que lo guía.\n\nKazym colocó la pluma en el cuervo de piedra. Pregunta: “¿Qué es una muerte justa?”\nRespuesta de Kazym: “La muerte justa no es aquella que se quita, es aquella que se da.”\nSantuario: “Incompleto… pero verdadero.”\n\nTres símbolos: moneda/llave; registro/memoria; cuenco/entrega.\nSegundo: Kazym grabó símbolo Shadar-kai de MADRE. Mensaje: “Lo recordado no muere mientras alguien elija llevarlo.”\nTercero: Kazym declaró que entregaba libremente su voluntad a su destino.\nSantuario aceptó “VOLUNTAD” y advirtió:\n“La muerte arrebatada esclaviza.\nLa memoria preservada permanece.\nLa voluntad entregada vincula.\nPero incluso la devoción elegida puede convertirse en una cadena.”"},{"entry_id":"BIBLE_5_6","major_section":"5","subsection":"5.6","sort_order":34,"title":"5.6. FALSA MADRE Y MNEMÓFAGO","visibility":"both","source":"Campaign Bible v3","body":"El suelo abrió una escalera. Olor de infancia y una voz “Kazym…”. Abajo apareció la madre exactamente como la recordaba.\n\nKazym dijo que la había seguido “durante siglos”. Algo no encajó.\n\nTirada clave: Percepción 19.\nInconsistencias: lámpara sin sombras, capa inmóvil, perfume demasiado exacto, ausencia de respiración, pronunciación congelada en recuerdos de infancia. Tomás negó discretamente con la cabeza.\n\nKazym intentó romper la ilusión: salvación SAB 11. No bastó para disiparla, pero provocó un fallo visual que reveló algo oscuro.\nKazym: “Tú no eres mi madre… demonio, revélate.”\n\nLa criatura reveló forma de sombra/velo que usaba caras y recuerdos. No era demonio ni no-muerto estándar. Con Arcana 19, Kazym concluyó que parecía un parásito psíquico del Shadowfell, “mnemófago / devorador de memoria / eco hambriento”. Su gema era ancla física.\n\nLa criatura golpeó a Kazym con 24 al ataque e infligió 11 psíquico.\nTomás ayudó con luz divina para exponer el núcleo.\nKazym realizó ataques con flanqueo. Golpe relevante al núcleo: 14 al ataque, 15 daño. Ataque final: 22 al ataque, 21 daño; gema destruida en 3 fragmentos.\nKazym lloró al ver desaparecer el rostro falso de su madre.\nPensamiento: “No era el encarcelado… era el carcelero.”\n\nBotín: 3 fragmentos de gema, pluma negra, pieza metálica con símbolo CAMINO."},{"entry_id":"BIBLE_5_7","major_section":"5","subsection":"5.7","sort_order":35,"title":"5.7. CAMINO, MUJER DE CABELLO BLANCO Y MENSAJE DE LA MADRE","visibility":"both","source":"Campaign Bible v3","body":"Una puerta oculta marcada “camino — memoria — regreso” se abrió con la pieza CAMINO. Hubo bifurcaciones y una inscripción:\n“Quien sigue una sombra debe aprender algún día a caminar sin ella.”\n\nKazym eligió seguir recto, sin distraerse por bifurcaciones. Halló una lámpara antigua, recipiente con dibujo simple de cuervo con un ala ligeramente mayor —estilo que reconoció como de su madre—, tira de tela gris y huellas descalzas.\n\nUna plataforma descendió. Kazym sintió el daño psíquico y pidió curación. Tomás curó 8 PG.\n\nAbajo, Percepción 17: al menos ocho personas inmóviles, no cadáveres normales, ojos abiertos; mujer de cabello blanco sentada con plumas negras a los pies; símbolo CAMINO detrás.\nElla dijo:\n“Así que finalmente llegó alguien que todavía puede elegir.”\n\nKazym se arrodilló por respeto.\nElla interrogó su motivo para buscar a su madre. Kazym explicó que no la busca por lo que a él le falta, sino para liberarla de culpa: quiere que sepa que está bien y que no la odia.\n\nLa mujer aceptó que eso cambia el sentido de la búsqueda. Le entregó un paquete dejado por la madre de Kazym “para alguien que llegara por decisión propia”.\n\nContenido:\n- pieza de hueso oscuro: REGRESO;\n- pergamino escrito por la madre;\n- mapa simple al reverso con una torre/aguja rota.\n\nMensaje central de la madre:\nSi eres tú, sobreviviste más de lo que esperaba y sufriste más de lo que quise.\nNo me sigas porque creas que me debes algo.\nNo me sigas porque pienses que yo te debo algo.\nSi todavía quieres encontrarme, hazlo porque tu corazón eligió hacerlo.\nCuando me encuentres, no corras hacia mí como el niño que dejé atrás.\nVen como el hombre que eligió seguir caminando.\n\nLa mujer afirmó que la madre no pasó huyendo: pasó eligiendo adónde ir."},{"entry_id":"BIBLE_5_8","major_section":"5","subsection":"5.8","sort_order":36,"title":"5.8. REGRESO AL PUEBLO Y NACIMIENTO DE FACCIÓN","visibility":"both","source":"Campaign Bible v3","body":"El grupo escapó del santuario por ruta secundaria y ocultó el rastro. Sigilo de Kazym en escape: 23. Volvieron al pueblo.\n\nKazym propuso reclutar gente y escalar una facción. Maera señaló que tres personas no eran una organización. La sacerdotisa ofreció una antigua casa de guardia al norte del pueblo sin pago mientras sirviera para proteger la región.\n\nObjetivo: construir red con núcleo informado, agentes de campo y contactos compartimentados; miembros fuera de party pueden investigar, vigilar, entrenar, reparar o cumplir misiones.\n\nKazym alcanzó nivel 4 por PX acumulados de 3.550 y eligió Precisión Élfica; DES 17→18."},{"entry_id":"BIBLE_5_9","major_section":"5","subsection":"5.9","sort_order":37,"title":"5.9. CASA DE GUARDIA — BRAN Y PIPIK","visibility":"both","source":"Campaign Bible v3","body":"Al llegar, Kazym vio un cuervo y lo interpretó como señal:\n“Es una señal. Es aquí.”\nEntró por el frente con confianza.\n\nHabló al cuervo como residente:\n“¿Cuál es tu nombre?”\nTrato con Animales: 17.\nEl cuervo tenía anilla “BRAN”.\n\nAl acercarse a torre, Sigilo de Kazym: 1+8=9. Pisó metal y alertó a alguien dentro.\n\nKazym ordenó:\n“Sal con las manos arriba.”\n\nApareció Pipik, kobold, con herramientas. Explicó que venía de Grietas de Cobre, buscaba un lugar seguro para los suyos y había visto cultistas buscando una entrada. Dijo que un hombre llevaba máscara de hueso.
