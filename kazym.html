function wireCarousel(root,trackSelector=".hTrack"){
  const track=$(trackSelector,root),prev=$('[data-carousel-prev]',root),next=$('[data-carousel-next]',root),wrap=$('.carouselWrap',root);
  if(!track||!prev||!next)return;
  const step=()=>Math.max(280,Math.floor(track.clientWidth*.82));
  const update=()=>{
    const overflow=track.scrollWidth>track.clientWidth+4;
    if(wrap)wrap.classList.toggle('noOverflow',!overflow);
    prev.disabled=!overflow||track.scrollLeft<=3;
    next.disabled=!overflow||track.scrollLeft+track.clientWidth>=track.scrollWidth-4;
  };
  prev.onclick=()=>track.scrollBy({left:-step(),behavior:'smooth'});
  next.onclick=()=>track.scrollBy({left:step(),behavior:'smooth'});
  track.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update,{passive:true});
  requestAnimationFrame(update);
}

  if(rows.length)wireCarousel(root);
}

  return`<div class="projectSummary"><span class="pill">${uiIcon("AST_UI_PROJECT_COMPLETE","Completados","summaryIcon")}Completados ${counts.done}</span><span class="pill">${uiIcon("AST_UI_PROJECT_ACTIVE","Activos","summaryIcon")}Activos ${counts.active}</span><span class="pill">${uiIcon("AST_UI_PROJECT_PENDING","Pendientes","summaryIcon")}Pendientes ${counts.pending}</span></div><div class="projectGrid">${projects.map(p=>`<article class="projectCard ${projectStatusClass(p.status)}"><div class="projectImage">${p.image?img(p.image,"",p.name):`<div class="roomIconSlot">PR</div>`}</div><div class="projectBody"><div class="status projectStatusLine"><span class="projectStatusIcon">${uiIcon(projectStatusAssetId(p.status),p.status)}</span>${esc(p.status||"")}</div><h4>${esc(p.name||"")}</h4><div class="projectMeta">${p.cost?`<div><b>Materiales:</b> ${esc(p.cost)}</div>`:""}${p.duration?`<div><b>Jornadas:</b> ${esc(p.duration)}</div>`:""}${p.result?`<div><b>Resultado:</b> ${esc(p.result)}</div>`:""}${p.notes?`<div><b>Nota:</b> ${esc(p.notes)}</div>`:""}</div></div></article>`).join("")}</div>`;
}
function renderMap(root){const map=DATA.maps.find(m=>String(m.status||'active')==='active')||DATA.maps[0];if(!root||!map||!map.image){if(root)root.innerHTML=`<div class="empty">Mapa no disponible.</div>`;return}const markers=DATA.map_markers.filter(m=>String(m.map_id)===String(map.map_id));root.innerHTML=`<div class="reconCard"><div class="mapTools"><button class="mapTool" data-out>−</button><button class="mapTool" data-reset>⌂</button><button class="mapTool" data-in>+</button><span class="mapZoom">100%</span></div><div class="mapViewport"><div class="mapStage">${img(map.image,"",map.name)}${markers.map(m=>`<button class="marker" style="left:${num(m.x_percent)??0}%;top:${num(m.y_percent)??0}%" data-marker="${esc(m.marker_id)}"><span class="markerUI">${img(m.image,"",m.label)}<span class="markerTip"><b>${esc(m.label||"")}</b><br>${esc(m.tooltip||m.type_label||"")}</span></span></button>`).join("")}</div></div></div><div class="mapDetail"></div>`;const vp=$('.mapViewport',root),stage=$('.mapStage',root),read=$('.mapZoom',root),detail=$('.mapDetail',root);let scale=num(map.default_zoom)??1,tx=0,ty=0,pan=false,lx=0,ly=0;const min=num(map.min_zoom)??1,max=num(map.max_zoom)??4;const apply=()=>{stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;$$('.markerUI',root).forEach(x=>x.style.setProperty('--counter',1/scale));read.textContent=Math.round(scale*100)+'%'};const zoom=(next,cx,cy)=>{next=Math.min(max,Math.max(min,next));const wx=(cx-tx)/scale,wy=(cy-ty)/scale;tx=cx-wx*next;ty=cy-wy*next;scale=next;apply()};const center=n=>{const r=vp.getBoundingClientRect();zoom(n,r.width/2,r.height/2)};$('[data-in]',root).onclick=()=>center(scale*1.25);$('[data-out]',root).onclick=()=>center(scale/1.25);$('[data-reset]',root).onclick=()=>{scale=num(map.default_zoom)??1;tx=0;ty=0;apply()};vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoom(scale*(e.deltaY<0?1.12:.89),e.clientX-r.left,e.clientY-r.top)},{passive:false});vp.onpointerdown=e=>{if(e.target.closest('.marker'))return;pan=true;lx=e.clientX;ly=e.clientY;vp.classList.add('pan')};vp.onpointermove=e=>{if(!pan)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply()};vp.onpointerup=vp.onpointercancel=()=>{pan=false;vp.classList.remove('pan')};$$('[data-marker]',root).forEach(b=>b.onclick=()=>{const m=markers.find(x=>x.marker_id===b.dataset.marker);detail.innerHTML=`<div class="card"><div class="status">${esc(m.type_label||m.marker_type||"")}</div><h3>${esc(m.label||"")}</h3><p>${esc(m.tooltip||"")}</p></div>`});apply()}
function renderRules(){
  const root=$("#rules .sectionBody"),rows=DATA.rules||[];
  if(!rows.length){root.innerHTML=`<div class="empty">Sin reglas.</div>`;return}
  root.innerHTML=`<div class="ruleToolbar"><input class="search" id="ruleSearch" placeholder="Filtrar reglas…"><span class="ruleCount"></span></div><div class="carouselWrap sectionCarousel compactOneRow"><div class="carouselControls"><button class="circleBtn" type="button" data-carousel-prev aria-label="Regla anterior">‹</button><button class="circleBtn" type="button" data-carousel-next aria-label="Regla siguiente">›</button></div><div class="hTrack ruleTrack"></div></div>`;
  const draw=()=>{const q=norm($('#ruleSearch',root).value),filtered=rows.filter(r=>norm(`${r.title} ${r.status} ${r.source_book||r.source||""} ${r.notes||r.body||r.description||""}`).includes(q));$('.ruleCount',root).textContent=`${filtered.length} regla(s)`;$('.ruleTrack',root).innerHTML=filtered.map(r=>`<article class="card compactRule"><div class="status">${esc(r.status||"")}</div><h3>${esc(r.title||"")}</h3><div><span class="pill">${esc(r.source_book||r.source||"Regla de campaña")}</span></div><div class="compactRuleText long">${esc(r.notes||r.body||r.description||"")}</div></article>`).join("")||`<div class="empty">Sin coincidencias.</div>`;wireCarousel(root,'.ruleTrack')};
  $('#ruleSearch',root).oninput=draw;draw();
}
function renderCheckpoint(){
  const c=DATA.checkpoint||{},root=$("#checkpoint .sectionBody");
  root.innerHTML=`<div class="checkpointCompact">
    <div class="checkpointPanel"><div class="eyebrow">${esc(c.title||"Checkpoint actual")}</div><h3>${esc(c.location||"Punto de continuación")}</h3><p style="font-size:.72rem;color:#aaa297;line-height:1.4">${esc(c.state||"")}</p></div>

  </div>`;

function renderBible(){const root=$("#campaign_bible .sectionBody"),rows=DATA.bible.filter(r=>r.entry_id!=="META"),majors=[...new Set(rows.map(r=>String(r.major_section||"")))].filter(Boolean).sort((a,b)=>(+a||999)-(+b||999));root.innerHTML=`<div class="bibleToolbar"><input class="search" id="bibleSearch" placeholder="Buscar en el archivo…"><div class="majorNav">${majors.map((m,i)=>`<button class="majorBtn ${i===0?'active':''}" data-major="${esc(m)}">${esc(m)}</button>`).join("")}</div></div><div id="bibleRows"></div>`;let active=majors[0]||"";const draw=()=>{const q=norm($('#bibleSearch').value);let r=rows;if(q)r=r.filter(x=>norm(`${x.title} ${x.body}`).includes(q));else if(active)r=r.filter(x=>String(x.major_section)===active);$('#bibleRows').innerHTML=r.map(x=>`<details class="bibleEntry"><summary>${esc(x.title||"")}</summary><div class="detailBody">${esc(x.body||"")}</div></details>`).join("")||`<div class="empty">Sin contenido.</div>`};$$('[data-major]',root).forEach(b=>b.onclick=()=>{active=b.dataset.major;$('#bibleSearch').value="";$$('[data-major]',root).forEach(x=>x.classList.toggle('active',x===b));draw()});$('#bibleSearch').oninput=draw;draw()}
function renderChangelog(){
  const root=$("#changelog .sectionBody"),rows=[...(DATA.changelog||[])].reverse();
  root.innerHTML=rows.length?`<div class="carouselWrap sectionCarousel compactOneRow"><div class="carouselControls"><button class="circleBtn" type="button" data-carousel-prev aria-label="Cambio anterior">‹</button><button class="circleBtn" type="button" data-carousel-next aria-label="Cambio siguiente">›</button></div><div class="hTrack">${rows.map(x=>`<article class="card compactChange"><div class="status">${esc(x.category||"")}</div><h3>${esc(x.version||"")} · ${esc(x.date||"")}</h3><div class="compactChangeText">${esc(x.change||x.summary||"")}</div></article>`).join("")}</div></div>`:`<div class="empty">Sin cambios.</div>`;
  if(rows.length)wireCarousel(root);
}
function renderAll(){shell();renderCharacters();renderHistory();renderBase();renderNPCs();renderBestiary();renderLore();renderMysteries();renderItems();renderRules();renderCheckpoint();renderBible();renderChangelog();const kazym=DATA.characters.find(c=>c.character_id==='PC_KAZYM')||DATA.characters[0],b=DATA.base||{};$('#brand').textContent=CONFIG.campaign_name||'KAZYM GARNITHOR';$('#heroTitle').textContent=CONFIG.site_title||'Kazym Garnithor';$('#heroSubtitle').textContent=CONFIG.site_subtitle||'Campaign Codex vivo';$('#eyebrow').textContent=CONFIG.ruleset||'D&D 5e 2014';if(kazym){$('#kLvl').textContent=kazym.level||'—';$('#kXp').textContent=kazym.xp||'—'}$('#kAllies').textContent=DATA.characters.length||'—';$('#kBase').textContent=`${b.functions_restored||'—'}/${b.functions_total||'—'}`;initNavSpy()}
function initNavSpy(){const links=new Map($$('.navlink').map(a=>[a.getAttribute('href').slice(1),a]));const io=new IntersectionObserver(es=>{const hit=es.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(hit){links.forEach(a=>a.classList.remove('active'));links.get(hit.target.id)?.classList.add('active')}},{rootMargin:'-25% 0px -60% 0px',threshold:[0,.1,.3]});sectionDefs().forEach(([id])=>{const s=document.getElementById(id);if(s)io.observe(s)})}
async function refresh(){const mode=$('#mode'),diag=$('#diag');try{$('#refresh').disabled=true;mode.textContent='Cargando…';mode.className='badge';diag.classList.remove('show');DB=await load();DATA=build(DB);renderAll();mode.textContent='Sheet vivo · '+new Date().toLocaleTimeString();mode.className='badge live'}catch(e){console.error(e);mode.textContent='Error';mode.className='badge err';diag.textContent='No se pudo cargar el MASTER: '+(e.message||e);diag.classList.add('show')}finally{$('#refresh').disabled=false}}
$('#refresh').onclick=refresh;$('#modalClose').onclick=()=>{$('#charModal').classList.remove('open');document.body.style.overflow=''};$('#charModal').onclick=e=>{if(e.target.id==='charModal')$('#modalClose').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalClose').click()});refresh();
</script>
