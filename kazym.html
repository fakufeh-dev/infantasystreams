function parseCSV(t){
const R=[];let r=[],c="",q=false;
for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===","&&!q){r.push(c);c="";continue}if((x==="\n"||x==="\r")&&!q){if(x==="\r"&&n==="\n")i++;r.push(c);if(r.some(v=>v.trim()))R.push(r);r=[];c="";continue}c+=x}

}
function normalizeHeader(v){return String(v||"").trim().replace(/^\ufeff/,"")}

const headers=rows[headerIndex].map(normalizeHeader);
return{ok:true,headers,headerIndex,rows:rows.slice(headerIndex+1).filter(r=>r.some(x=>String(x||"").trim())).map(r=>Object.fromEntries(headers.map((k,i)=>[k,r[i]??""]).filter(([k])=>k)))}
}

}
