<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Codex de Campaña — Kazym Garnithor</title>

<style>
:root{
  --bg:#0b0d13;
  --bg2:#11141c;
  --panel:#171a24;
  --panel2:#1e2230;
  --line:#393d4c;
  --line2:#514b59;
  --ink:#eee7d9;
  --muted:#a9a296;
  --gold:#b99a67;
  --purple:#76668c;
  --red:#b26a70;
  --green:#82a47d;
  --orange:#c69a65;
  --paper:#d9cfb5;
  --paperInk:#1d1a17;
  --radius:14px;
  --shadow:0 18px 55px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 25% -8%,rgba(80,55,100,.42),transparent 34%),
    radial-gradient(circle at 88% 12%,rgba(72,53,45,.19),transparent 30%),
    linear-gradient(180deg,#0b0c11,#11131b 52%,#090a0e);
}

button,
input{
  font:inherit;
}

button{
  color:inherit;
}

a{
  color:inherit;
}

img{
  max-width:100%;
}

.site-header{
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #30333e;
  background:rgba(11,13,19,.93);
  backdrop-filter:blur(14px);
}

.nav{
  width:min(1500px,100%);
  margin:auto;
  padding:11px 18px;
  display:flex;
  align-items:center;
  gap:8px;
}

.brand{
  margin-right:auto;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.12em;
  white-space:nowrap;
}

.nav a{
  text-decoration:none;
  color:#c9c1b5;
  font-size:.77rem;
  padding:7px 8px;
  border-radius:7px;
}

.nav a:hover{
  background:#222631;
  color:#fff;
}

.live-btn{
  border:1px solid #504759;
  background:#191b26;
  color:#ddd4c7;
  padding:7px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:.7rem;
  white-space:nowrap;
}

.live-btn:hover{
  background:#262a37;
}

.live-btn.loading{
  pointer-events:none;
  opacity:.55;
}

.mode-badge{
  border:1px solid #504759;
  color:#c3b6cf;
  border-radius:999px;
  padding:6px 8px;
  font-size:.66rem;
  white-space:nowrap;
}

.mode-badge.live{
  border-color:#4d6b51;
  color:#a6cea1;
}

.mode-badge.error{
  border-color:#75454b;
  color:#dfa1a5;
}

.hero{
  width:min(1400px,100%);
  margin:auto;
  padding:52px 20px 27px;
  display:grid;
  grid-template-columns:1.45fr .75fr;
  gap:26px;
}

.eyebrow{
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:.73rem;
}

h1{
  margin:.16em 0 .25em;
  font-size:clamp(2.6rem,6vw,5.4rem);
  line-height:.92;
}

.hero p{
  max-width:780px;
  color:#c6beb3;
  line-height:1.68;
}

.panel,
.card,
.accordion,
.avatar-frame,
.monster-card,
.npc-card,
.item-card,
.mystery-card,
.base-room{
  border:1px solid var(--line);
  background:
    linear-gradient(180deg,rgba(31,34,47,.97),rgba(19,22,31,.97));
  box-shadow:var(--shadow);
}

.hero-card{
  padding:18px;
  border-radius:var(--radius);
  align-self:end;
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.kpi{
  padding:13px;
  background:#12151e;
  border:1px solid #393c48;
  border-radius:10px;
}

.kpi b{
  display:block;
  font-size:1.5rem;
  color:#f0eadd;
}

.kpi span{
  color:#969086;
  font-size:.72rem;
}

main{
  width:min(1400px,100%);
  margin:auto;
  padding:0 20px 70px;
}

section{
  padding:33px 0;
}

.section-head{
  margin-bottom:18px;
  display:flex;
  align-items:flex-end;
  gap:16px;
}

.section-head h2{
  margin:0;
  font-size:1.95rem;
}

.section-head p{
  margin:4px 0 0;
  max-width:750px;
  color:var(--muted);
  line-height:1.5;
}

.toolbar{
  margin-left:auto;
}

.search{
  min-width:220px;
  padding:9px 11px;
  border:1px solid #383b47;
  border-radius:8px;
  background:#12151d;
  color:#eee8dd;
}

.avatar-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:17px;
}

.avatar-card{
  border:0;
  background:none;
  padding:0;
  cursor:pointer;
