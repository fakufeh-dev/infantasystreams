<script>

const DEFAULT_SHEET_ID =
"1WsuHIOT0wQRd1jZcIzaBBMJCeZhwPQ0rPpQ96-aFBwg";

const TAB_NAMES = [
"config",
"sections",
"assets",

"characters",
"character_stats",
"character_saves",
"character_skills",
"character_proficiencies",
"character_traits",
"character_attacks",
"character_spells",
"character_spell_slots",
"character_equipment",
"relationships",

"history",
"history_rolls",

"npcs",

"bestiary",
"enemy_traits",

"base_overview",
"base_rooms",
"base_projects",
"base_protocols",
"faction_members",

"lore",
"mysteries",
"items",
"rules",
"checkpoint",
"changelog"
];

let DB = {};
let DATA = {};
let ASSETS = new Map();
let CONFIG = {};
let SECTION_CONFIG = [];
let TIMER = null;

const $ = selector =>
document.querySelector(selector);

const esc = value =>
String(value ?? "").replace(
/[&<>"']/g,
char => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[char])
);

const norm = value =>
String(value || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.trim();

const truth = value =>
["true","1","yes","si","sí","on"]
.includes(norm(value));

const arr = value =>
Array.isArray(value)
? value
: String(value || "")
.split(/\r?\n|;;|\s*\|\s*/)
.map(x => x.trim())
.filter(Boolean);

const number = value => {

const parsed =
Number(
String(value ?? "")
.replace(",",".")
);

return Number.isFinite(parsed)
? parsed
: null;

};

const val = value =>
value === undefined ||
value === null ||
value === ""
? "—"
: value;

const modifier = value => {

const score =
number(value);

if(score === null)
return "—";

const m =
Math.floor(
(score - 10) / 2
);

return (
m >= 0
? "+"
: ""
) + m;

};

function driveId(value){

const text =
String(value || "")
.trim();

if(!text)
return "";

if(
/^[A-Za-z0-9_-]{20,}$/
.test(text)
)
return text;

let match =
text.match(
/\/d\/([A-Za-z0-9_-]{20,})/
);

if(match)
return match[1];

match =
text.match(
/[?&]id=([A-Za-z0-9_-]{20,})/
);

if(match)
return match[1];

return "";

}

function driveCandidates(value){

const original =
String(value || "")
.trim();

if(!original)
return [];

const id =
driveId(original);

if(!id){

return /^https?:/i.test(original)
? [original]
: [];

}

return [
`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`,
`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w2000`,
`https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`
];

}

function imageRef(value){

const candidates =
driveCandidates(value);

return {
src:candidates[0] || "",
fallbacks:candidates.slice(1)
};

}

function imgHtml(
value,
className="",
alt=""
){

const ref =
imageRef(value);

if(!ref.src)
return "";

return `
<img
class="${esc(className)}"
src="${esc(ref.src)}"
alt="${esc(alt)}"
data-drive-fallbacks='${esc(JSON.stringify(ref.fallbacks))}'
data-drive-index="0"
>
`;

}

document.addEventListener(
"error",
event => {

const img =
event.target;

if(
!(img instanceof HTMLImageElement)
)
return;

if(
!img.dataset.driveFallbacks
)
return;

let fallbacks = [];

try{

fallbacks =
JSON.parse(
img.dataset.driveFallbacks
);

}
catch(error){

fallbacks = [];

}

const index =
Number(
img.dataset.driveIndex || 0
);

if(
index < fallbacks.length
){

img.dataset.driveIndex =
String(index + 1);

img.src =
fallbacks[index];

return;

}

img.classList.add(
"drive-broken"
);

},
true
);

function parseCSV(text){

const rows = [];

let row = [];
let cell = "";
let quoted = false;

for(
let i = 0;
i < text.length;
i++
){

const char =
text[i];

const next =
text[i + 1];

if(
char === '"' &&
quoted &&
next === '"'
){

cell += '"';
i++;
continue;

}

if(char === '"'){

quoted = !quoted;
continue;

}

if(
char === "," &&
!quoted
){

row.push(cell);
cell = "";
continue;

}

if(
(char === "\n" || char === "\r") &&
!quoted
){

if(
char === "\r" &&
next === "\n"
)
i++;

row.push(cell);

if(
row.some(
value =>
value.trim() !== ""
)
)
rows.push(row);

row = [];
cell = "";
continue;

}

cell += char;

}

row.push(cell);

if(
row.some(
value =>
value.trim() !== ""
)
)
rows.push(row);

return rows;

}

function rowsToObjects(rows){

if(!rows.length)
return [];

let headerIndex = 0;
let best = -1;

for(
let i = 0;
i < Math.min(5,rows.length);
i++
){

const count =
rows[i]
.filter(
value =>
String(value).trim() !== ""
)
.length;

if(count > best){

best = count;
headerIndex = i;

}

}

const headers =
rows[headerIndex]
.map(
value =>
String(value).trim()
);

return rows
.slice(headerIndex + 1)
.filter(
row =>
row.some(
value =>
String(value).trim() !== ""
)
)
.map(row => {

const object = {};

headers.forEach(
(header,index) => {

if(header)
object[header] =
row[index] ?? "";

}
);

return object;

});

}

async function loadTab(name){

const url =
`https://docs.google.com/spreadsheets/d/${DEFAULT_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;

const response =
await fetch(
url,
{
cache:"no-store"
}
);

if(!response.ok)
throw new Error(
`${name}: HTTP ${response.status}`
);

const text =
await response.text();

if(
/<!doctype|<html/i
.test(text)
)
throw new Error(
`${name}: el Sheet no es accesible públicamente`
);

return rowsToObjects(
parseCSV(text)
)
.filter(
row =>
![
"dm",
"secret",
"secreto",

async function loadDB(){

setMode(
"Cargando…"
);

const result = {};

await Promise.all(
TAB_NAMES.map(
async name => {

try{

result[name] =
await loadTab(name);

}
catch(error){

console.warn(
"Pestaña no disponible:",
name,
error
);

result[name] = [];

}

}
)
);

if(
!result.characters.length &&
!result.history.length &&
!result.assets.length
)
throw new Error(
"No se pudieron leer datos del Google Sheet"
);

return result;

}

function group(rows,key){

const map =
new Map();

(rows || [])
.forEach(row => {

const id =
row[key] || "";

if(!map.has(id))
map.set(id,[]);

map.get(id).push(row);

});

return map;

}

function first(rows,key){

const map =
new Map();

(rows || [])
.forEach(row => {

const id =
row[key] || "";

if(
id &&
!map.has(id)
)
map.set(id,row);

});

return map;

}

function configObject(rows){

const result = {};

(rows || [])
.forEach(row => {

if(row.key)
result[row.key] =
row.value;

});

return result;

}

function byOrder(a,b){

return (
number(a.sort_order) ?? 999
) - (
number(b.sort_order) ?? 999
);

}

function asset(assetId){

return ASSETS.get(
String(assetId || "").trim()
) || null;

}

function assetImage(assetId){

const record =
asset(assetId);

if(!record)
return "";

return (
record.drive_file_id ||
record.url ||
record.image_url ||
""
);

}

function displayName(item){

return typeof item === "string"
? item
: (
item?.name ||
item?.item ||
item?.skill ||
item?.title ||
""
);

}

function list(items){

return `
<ul class="list">
${(items || [])
.map(
item =>
`<li>${esc(displayName(item))}</li>`
)
.join("")}
</ul>
`;

}

const npcs =

(db.items || [])

{

function cfg(
key,
fallback=""
){

CONFIG[key] !== undefined &&
CONFIG[key] !== ""
)

function createSection(
id,
title,
subtitle
){

const section =
document.createElement(
"section"
);

section.id = id;

section.innerHTML = `
<div class="head">
<div>
<h2>${esc(title)}</h2>
<p>${esc(subtitle || "")}</p>
</div>
</div>

<div class="sectionBody"></div>
`;

return section;

}

function sectionMeta(
id,
title,
subtitle,
order
){

const row =
SECTION_CONFIG.find(
entry =>
entry.section_id === id
);

if(!row)
return {
title,
subtitle,
visible:true,
sort_order:order
};

return {
title:
row.title || title,

subtitle:
row.subtitle || subtitle,

visible:
row.visible === ""
? true
: truth(row.visible),

sort_order:
number(row.sort_order) ?? order
};

}

function body(id){

return document.querySelector(
`#${id} .sectionBody`
);

}

[

};

}

function traitGroups(character){

const result = {
species:[],
class:[],
other:[]
};

(character.traits || [])
.forEach(trait => {

const category =
norm(
trait.category ||
trait.trait_type
);

if(
category === "species" ||
category === "race"
)
result.species.push(trait);

else if(
category === "class"
)
result.class.push(trait);

else
result.other.push(trait);

});

return result;

}

function saveMap(character){

return Object.fromEntries(
(character.saves || [])
.map(save => [
String(
save.ability ||
save.save ||
save.name ||
""
).toUpperCase(),
save.bonus ||
save.value ||
""
])
);

}

function profList(
character,
category
){

return (
character.proficiencies || []

.filter(entry =>
norm(entry.category) === category
)
.map(entry =>
entry.name ||
entry.proficiency ||
""
);

}

function attackDisplay(attack){

const name =
attack.name ||
attack.attack ||
"";

if(
attack.attack_bonus ||
attack.damage
)
return {
name,
bonus:
attack.attack_bonus ||
attack.bonus ||
"",
damage:
attack.damage ||
"",
type:
attack.damage_type ||
"",
props:
attack.range ||
attack.properties ||
""
};

const match =
name.match(
/^(.*?)\s([+-]\d+)\s+[—-]\s+(.+)$/
);

return {
name:
match
? match[1]
: name,

bonus:
match
? match[2]
: "",

damage:
match
? match[3]
: "",

type:"",
props:""
};

}

function fitOne(element){

const max =
number(element.dataset.max) ||
parseFloat(
getComputedStyle(element)
.fontSize
) ||
12;

const min =
number(element.dataset.min) ||
5;

element.style.fontSize =
max + "px";

element.style.lineHeight =
"1.1";

let size =
max;

const overflow = () =>
element.scrollWidth >
element.clientWidth + 1 ||
element.scrollHeight >
element.clientHeight + 1;

while(
size > min &&
overflow()
){

size -= .35;

element.style.fontSize =
size + "px";

if(
element.classList.contains(
"fitBox"
)
){

element.style.lineHeight =
String(
Math.max(
.95,
1.12 -
(max - size) * .015
)
);

}

}

}

function fitSheetText(){

document.querySelectorAll(
"#sheet .fitText,#sheet .fitBox"
)
.forEach(
fitOne
);

}

function showTip(
data,
event
){

const tip =
$("#tip");

const rows =
(data.rows || [])
.map(row => `
<dt>${esc(row[0])}</dt>
<dd>${esc(row[1])}</dd>
`)
.join("");

tip.innerHTML = `
<div class="k">
${esc(data.kind)}
</div>

<h4>
${esc(data.title)}
</h4>

<p>
${esc(data.desc || "")}
</p>

${rows
? `<dl>${rows}</dl>`
: ""
}
`;

tip.classList.add(
"show"
);

positionTip(event);

}

function positionTip(event){

const tip =
$("#tip");

if(
!tip.classList.contains(
"show"
)
)
return;

let x =
event.clientX + 15;

let y =
event.clientY + 15;

const box =
tip.getBoundingClientRect();

if(
x + box.width >
window.innerWidth - 10
)
x =
event.clientX -
box.width -
15;

if(
y + box.height >
window.innerHeight - 10
)
y =
window.innerHeight -
box.height -
10;

tip.style.left =
Math.max(10,x) + "px";

tip.style.top =
Math.max(10,y) + "px";

}

document.addEventListener(
"mouseover",
event => {

const target =
event.target.closest?.(
"[data-tip]"
);

if(!target)
return;

try{

showTip(
JSON.parse(
target.dataset.tip
),
event
);

}
catch(error){}

}
);

document.addEventListener(
"mousemove",
positionTip
);

document.addEventListener(
"mouseout",
event => {

if(
event.target.closest?.(
"[data-tip]"
)
)
$("#tip")
.classList
.remove("show");

}
);

document.addEventListener(
"focusin",
event => {

const target =
event.target.closest?.(
"[data-tip]"
);

if(!target)
return;

try{

const rect =
target.getBoundingClientRect();

showTip(
JSON.parse(
target.dataset.tip
),
{
clientX:rect.right,
clientY:rect.top
}
);

}
catch(error){}

}
);

document.addEventListener(
"focusout",
() =>
$("#tip")
.classList
.remove("show")
);

}
