/* Preview ampliado al hacer hover */
#imagePreview{
  position:fixed;
  left:0;top:0;
  z-index:9998;
  width:190px;height:190px;
  display:none;
  pointer-events:none;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #9b835f;
  box-shadow:
    0 10px 30px #0008,
    inset 0 0 0 3px #0d1017cc,
    inset 0 0 22px #0005;
  background-color:#11151d;
  background-repeat:no-repeat;
  transform:translate(-50%,-50%);
}
#imagePreview.show{display:block}

#imagePreview img,
#imagePreview .previewCaption{display:none!important}

function resetDiagnostics(){

}

function addDiag(severity,code,title,detail="",context="",dedupe=""){
  const key=dedupe||[severity,code,title,detail,context].join("|");
  if(DIAG_KEYS.has(key))return;
  DIAG_KEYS.add(key);
  DIAGNOSTICS.push({
    severity:String(severity||"warn"),
    code:String(code||"GEN"),
    title:String(title||"Problema"),
    detail:String(detail||""),
    context:String(context||""),
    time:new Date().toLocaleTimeString()
  });
  console[severity==="error"?"error":severity==="warn"?"warn":"info"](`[${code}] ${title}`,detail,context);
  renderDiagnostics();
}

function renderDiagnostics(){
  const panel=document.getElementById("diagPanel");
  const list=document.getElementById("diagList");
  const sum=document.getElementById("diagSummary");
  const btn=document.getElementById("diagToggle");
  if(!panel||!list||!sum||!btn)return;

  const errors=DIAGNOSTICS.filter(x=>x.severity==="error").length;
  const warns=DIAGNOSTICS.filter(x=>x.severity==="warn").length;
  const problems=errors+warns;

  btn.textContent=`Diagnóstico ${problems}`;
  btn.classList.toggle("has-error",errors>0);
  btn.classList.toggle("has-warn",errors===0&&warns>0);

  sum.textContent=problems
    ? `${errors} error(es) · ${warns} advertencia(s)`
    : "Sin problemas detectados";

  list.innerHTML=DIAGNOSTICS.length
    ? DIAGNOSTICS.map(d=>`
      <div class="diag-item ${esc(d.severity)}">
        <div><span class="diag-code">${esc(d.code)}</span><span class="diag-title">${esc(d.title)}</span></div>
        ${d.detail?`<div class="diag-detail">${esc(d.detail)}</div>`:""}
        ${d.context?`<div class="diag-context">${esc(d.context)}</div>`:""}
      </div>`).join("")
    : `<div class="diag-item info"><span class="diag-code">OK</span><span class="diag-title">No se han detectado problemas.</span></div>`;

  if(errors>0)panel.hidden=false;
}

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])), norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim(), truth=v=>["true","1","yes","si","sí","on"].includes(norm(v)), arr=v=>Array.isArray(v)?v:String(v||"").split(/\r?\n|;;|\s*\|\s*/).map(x=>x.trim()).filter(Boolean), num=v=>{const n=Number(String(v??"").replace(",","."));return Number.isFinite(n)?n:null}, val=v=>v===undefined||v===null||v===""?"—":v, mod=v=>{const n=num(v);if(n===null)return"—";const m=Math.floor((n-10)/2);return(m>=0?"+":"")+m};
function parseCSV(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===","&&!q){r.push(c);c="";continue}if((x==="\n"||x==="\r")&&!q){if(x==="\r"&&n==="\n")i++;r.push(c);if(r.some(v=>v.trim()))R.push(r);r=[];c="";continue}c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);return R}
function normalizeHeader(v){
  return String(v||"").trim().replace(/^\ufeff/,"");
}

function rowsToObjects(name,rows){
  if(!rows.length){
    return {ok:false,headers:[],rows:[],reason:"CSV vacío"};
  }

  const expected=EXPECTED_SCHEMA[name]||[];
  const scanLimit=Math.min(8,rows.length);
  let headerIndex=-1;

  // Busca una fila que contenga TODOS los campos mínimos esperados.
  for(let i=0;i<scanLimit;i++){
    const cells=rows[i].map(normalizeHeader);
    if(expected.length && expected.every(k=>cells.includes(k))){
      headerIndex=i;
      break;
    }
  }

  // Para pestañas sin esquema explícito, usa la primera fila.
  if(headerIndex<0 && !expected.length) headerIndex=0;

  if(headerIndex<0){
    return {
      ok:false,
      headers:(rows[0]||[]).map(normalizeHeader),
      rows:[],
      reason:`No se encontró una fila de encabezados con: ${expected.join(", ")}`
    };
  }

  const headers=rows[headerIndex].map(normalizeHeader);
  const data=rows.slice(headerIndex+1)
    .filter(r=>r.some(x=>String(x||"").trim()))
    .map(r=>Object.fromEntries(
      headers.map((k,i)=>[k,r[i]??""]).filter(([k])=>k)
    ));

  return {ok:true,headers,rows:data,headerIndex};
}

async function fetchTabCSV(name,headersMode){
  const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&headers=${headersMode}&_=${Date.now()}`;

  let res;
  try{
    res=await fetch(u,{cache:"no-store"});
  }catch(e){
    const msg=String(e?.message||e||"Error de red");
    throw Object.assign(new Error(`${name}: no se pudo conectar con Google Sheets (${msg})`),{
      diagCode:"SHEET-NETWORK",
      diagTitle:"No se pudo conectar con Google Sheets",
      diagDetail:"Puede ser un problema de red, CORS, bloqueo del navegador o conexión sin Internet.",
      diagContext:`Pestaña: ${name}\n${u}`
    });
  }

  if(!res.ok){
    let code="SHEET-HTTP";
    let title=`Google Sheets respondió HTTP ${res.status}`;
    let hint="Revisa el ID del MASTER y la disponibilidad del documento.";

    if(res.status===401||res.status===403){
      code="SHEET-PERMISSION";
      title="El MASTER no permite lectura pública";
      hint="El Google Sheet debe poder leerse sin iniciar sesión.";
    }else if(res.status===404){
      code="SHEET-NOT-FOUND";
      title="No existe el MASTER o la pestaña solicitada";
      hint="Comprueba el SHEET_ID y el nombre exacto de la pestaña.";
    }else if(res.status===429){
      code="SHEET-RATE-LIMIT";
      title="Google Sheets está limitando las consultas";
      hint="Espera un momento o aumenta refresh_seconds.";
    }

    throw Object.assign(new Error(`${name}: HTTP ${res.status}`),{
      diagCode:code,diagTitle:title,diagDetail:hint,
      diagContext:`Pestaña: ${name}\n${u}`
    });
  }

  const text=await res.text();

  if(/<!doctype|<html/i.test(text)){
    throw Object.assign(new Error(`${name}: Google devolvió HTML en vez de CSV`),{
      diagCode:"SHEET-NOT-CSV",
      diagTitle:"Google no devolvió datos CSV",
      diagDetail:"Normalmente significa permisos, redirección a login o una URL de Sheet inválida.",
      diagContext:`Pestaña: ${name}\n${u}`
    });
  }

  return {text,url:u,headersMode};
}

async function tab(name){
  const attempts=[1,0];
  const failures=[];

  for(const headersMode of attempts){
    const fetched=await fetchTabCSV(name,headersMode);
    const parsed=rowsToObjects(name,parseCSV(fetched.text));

    if(parsed.ok){
      let rows=parsed.rows.filter(r=>
        !["dm","secret","secreto","private","privado"].includes(
          norm(r.visibility||r.scope||"both")
        )
      );

      TAB_STATUS[name]={
        ok:true,
        rows:rows.length,
        headers:parsed.headers,
        headerIndex:parsed.headerIndex,
        headersMode,
        schemaOk:true
      };

      if(headersMode===0){
        addDiag(
          "warn",
          "TAB-HEADER-RETRY",
          `La pestaña "${name}" necesitó reintento de encabezados`,
          "La primera lectura con headers=1 no produjo el esquema esperado; headers=0 sí funcionó.",
          `Headers finales: ${parsed.headers.join(", ")}`,
          `header-retry:${name}`
        );
      }

      return rows;
    }

    failures.push({
      mode:headersMode,
      reason:parsed.reason,
      headers:parsed.headers
    });
  }

  const expected=(EXPECTED_SCHEMA[name]||[]).join(", ");
  throw Object.assign(new Error(`${name}: esquema no reconocible`),{
    diagCode:"TAB-SCHEMA",
    diagTitle:`La pestaña "${name}" tiene encabezados incorrectos`,
    diagDetail:`No se encontró una fila válida de encabezados.\nSe esperaba: ${expected||"(sin esquema mínimo)"}`,
    diagContext:failures.map(f=>`headers=${f.mode}: ${f.reason}\nRecibido: ${(f.headers||[]).join(", ")}`).join("\n\n")
  });
}

function group(rows,key){const m=new Map;(rows||[]).forEach(r=>{const k=r[key]||"";if(!m.has(k))m.set(k,[]);m.get(k).push(r)});return m}function first(rows,key){const m=new Map;(rows||[]).forEach(r=>{const k=r[key]||"";if(k&&!m.has(k))m.set(k,r)});return m}function order(a,b){return(num(a.sort_order)??999)-(num(b.sort_order)??999)}function cfg(k,d=""){return CONFIG[k]!==undefined&&CONFIG[k]!==""?CONFIG[k]:d}function list(a){return`<ul class="list">${(a||[]).map(x=>`<li>${esc(typeof x==="string"?x:(x.name||x.item||x.skill||x.title||""))}</li>`).join("")}</ul>`}
/*
  v2.8.9 — IMÁGENES DIRECTAS DESDE GOOGLE DRIVE

  Fuente única:
  assets.drive_file_id

  El MASTER guarda URLs como:
  https://lh3.googleusercontent.com/d/<FILE_ID>

  local_path se conserva solo como referencia documental; el navegador
  NO busca una carpeta assets/ en GitHub Pages.
*/
function driveId(v){
  const s=String(v||"").trim();
  if(!s)return "";
  if(/^[A-Za-z0-9_-]{20,}$/.test(s))return s;
  let m=s.match(/\/d\/([A-Za-z0-9_-]{20,})/);
  if(m)return m[1];
  m=s.match(/[?&]id=([A-Za-z0-9_-]{20,})/);
  return m?m[1]:"";
}

function drivePrimary(v){
  const raw=String(v||"").trim();
  if(!raw)return "";
  if(/^https?:\/\//i.test(raw))return raw;
  const id=driveId(raw);
  return id?`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}`:"";
}

function driveFallbacks(v){
  const id=driveId(v);
  if(!id)return [];
  return [
    `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`,
    `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`
  ];
}

function imageUrl(v){
  if(v&&typeof v==="object"&&v.__assetError)return v;
  return String(v||"").trim();
}

function img(v,cls="",alt=""){
  const src=imageUrl(v);
  if(src&&typeof src==="object"&&src.__assetError){
    return inlineAssetErrorHTML(src);
  }
  if(!src)return "";
  const id=driveId(src);
  return `<img class="${esc(cls)}" src="${esc(src)}" alt="${esc(alt)}" data-asset-alt="${esc(alt)}" data-drive-id="${esc(id)}" data-drive-attempt="0" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
}

function queueImages(root=document){
  root.querySelectorAll("img").forEach(image=>{
    if(image.dataset.imageFallbackBound)return;
    image.dataset.imageFallbackBound="1";

    image.addEventListener("error",()=>{
      const id=image.dataset.driveId||driveId(image.getAttribute("src")||"");
      const attempt=Number(image.dataset.driveAttempt||0);
      const fallbacks=driveFallbacks(id);

      if(id && attempt < fallbacks.length){
        const next=fallbacks[attempt];
        image.dataset.driveAttempt=String(attempt+1);
        addDiag(
          "warn",
          "IMG-DRIVE-RETRY",
          `Reintentando imagen desde Google Drive`,
          `Falló el endpoint anterior. Se probará otra URL pública de Drive.`,
          `Archivo: ${image.alt||"Imagen"}\nDrive ID: ${id}\nSiguiente: ${next}`,
          `drive-retry:${id}:${attempt}`
        );
        image.src=next;
        return;
      }

      const raw=image.getAttribute("src")||"";
      const alt=image.getAttribute("data-asset-alt")||image.alt||"Imagen";
      addDiag(
        "error",
        "IMG-DRIVE-FAIL",
        `No se pudo cargar "${alt}" desde Google Drive`,
        `Se agotaron los endpoints públicos de Drive para este archivo. Revisa que el archivo siga compartido como \"Cualquiera con el enlace / lector\".`,
        `Drive ID: ${id||"no detectado"}\nÚltima URL: ${raw}`,
        `drive-fail:${id||raw}`
      );

      const box=document.createElement("div");
      box.className="image-error-inline";
      box.innerHTML=`<b>IMG-DRIVE-FAIL</b>
        <span>No se pudo cargar desde Google Drive</span>
        <span class="path">${esc(id||raw)}</span>
        <span class="hint">Revisa permisos públicos del archivo en Drive.</span>`;
      image.replaceWith(box);
    });
  });
}

function bindImageZoom(root=document){
  const preview=document.getElementById("imagePreview");
  if(!preview)return;

  const LENS_SIZE=190;
  const ZOOM=2.6;

  const hideLens=()=>{
    preview.classList.remove("show");
    preview.setAttribute("aria-hidden","true");
    preview.style.backgroundImage="";
    document.body.classList.remove("imageLensActive");
  };

  const objectPositionRatio=(token,axis)=>{
    const t=String(token||"").trim().toLowerCase();
    if(t.endsWith("%")){
      const n=parseFloat(t);
      return Number.isFinite(n)?n/100:.5;
    }
    if(axis==="x"){
      if(t==="left")return 0;
      if(t==="right")return 1;
    }else{
      if(t==="top")return 0;
      if(t==="bottom")return 1;
    }
    return .5;
  };

  const renderedContentBox=image=>{
    const rect=image.getBoundingClientRect();
    const nw=image.naturalWidth||rect.width;
    const nh=image.naturalHeight||rect.height;
    if(!rect.width||!rect.height||!nw||!nh)return null;

    const cs=getComputedStyle(image);
    const fit=(cs.objectFit||"fill").toLowerCase();

    let rw=rect.width;
    let rh=rect.height;

    if(fit==="contain"||fit==="cover"||fit==="scale-down"||fit==="none"){
      let scale=1;

      if(fit==="contain"){
        scale=Math.min(rect.width/nw,rect.height/nh);
      }else if(fit==="cover"){
        scale=Math.max(rect.width/nw,rect.height/nh);
      }else if(fit==="scale-down"){
        scale=Math.min(1,Math.min(rect.width/nw,rect.height/nh));
      }else{
        scale=1;
      }

      rw=nw*scale;
      rh=nh*scale;
    }

    const pos=String(cs.objectPosition||"50% 50%").trim().split(/\s+/);
    const px=objectPositionRatio(pos[0]||"50%","x");
    const py=objectPositionRatio(pos[1]||pos[0]||"50%","y");

    const ox=(rect.width-rw)*px;
    const oy=(rect.height-rh)*py;

    return{
      rect,
      left:rect.left+ox,
      top:rect.top+oy,
      width:rw,
      height:rh
    };
  };

  const updateLens=(image,e)=>{
    const src=image.currentSrc||image.src;
    if(!src)return;

    const box=renderedContentBox(image);
    if(!box)return;

    const x=e.clientX-box.left;
    const y=e.clientY-box.top;

    // No ampliar las bandas vacías creadas por object-fit: contain.
    if(x<0||y<0||x>box.width||y>box.height){
      hideLens();
      return;
    }

    preview.style.left=`${e.clientX}px`;
    preview.style.top=`${e.clientY}px`;
    preview.style.backgroundImage=`url("${src.replace(/"/g,'\\"')}")`;

    // La proporción del PNG se conserva: nunca usamos el rectángulo exterior
    // de la tarjeta para estirar la imagen.
    preview.style.backgroundSize=`${box.width*ZOOM}px ${box.height*ZOOM}px`;

    const bgX=(LENS_SIZE/2)-(x*ZOOM);
    const bgY=(LENS_SIZE/2)-(y*ZOOM);
    preview.style.backgroundPosition=`${bgX}px ${bgY}px`;

    preview.classList.add("show");
    preview.setAttribute("aria-hidden","false");
    document.body.classList.add("imageLensActive");
  };

  root.querySelectorAll("img").forEach(image=>{
    if(image.classList.contains("bg"))return;
    if(image.closest("#history"))return;

    if(image.dataset.zoomBound==="1")return;
    image.dataset.zoomBound="1";
    image.setAttribute("data-zoom-bound","1");

    image.addEventListener("mouseenter",e=>updateLens(image,e));
    image.addEventListener("mousemove",e=>updateLens(image,e));
    image.addEventListener("mouseleave",hideLens);
  });

  window.addEventListener("blur",hideLens,{once:false});
}

function assetValue(assetId,opts={}){
  const key=String(assetId||"").trim();
  const context=String(opts.context||"");
  const required=!!opts.required;

  if(!key){
    if(required){
      addDiag(
        "error","ASSET-ID-EMPTY","Falta el asset_id requerido",
        "El registro no contiene portrait_asset_id, image_asset_id o map_asset_id.",
        context,`asset-empty:${context}`
      );
      return inlineAssetError("ASSET-ID-EMPTY","Falta asset_id",context||"Registro sin referencia de imagen");
    }

function renderSectionNow(id){
  const root=body(id);
  const section=document.getElementById(id);
  if(!root||!section)return;
  if(root.dataset.rendered==="1"||root.dataset.rendering==="1")return;

  const renderer=sectionRenderers()[id];
  if(typeof renderer!=="function")return;

  root.dataset.rendering="1";
  try{
    renderer();
    root.dataset.rendered="1";
    section.classList.remove("is-lazy");
  }catch(e){
    addDiag(
      "error",
      "SECTION-RENDER",
      `No se pudo renderizar la sección "${id}"`,
      String(e?.message||e),
      `Sección: ${id}`,
      `section:${id}`
    );
    throw e;
  }finally{
    root.dataset.rendering="0";
  }
}

function initLazySections(){
  if(SECTION_OBSERVER)SECTION_OBSERVER.disconnect();

  const renderers=sectionRenderers();

  Object.keys(renderers).forEach(id=>{
    const root=body(id);
    const section=document.getElementById(id);
    if(!root||!section)return;
    root.dataset.rendered="0";
    root.dataset.rendering="0";

    if(EAGER_SECTIONS.has(id)){
      root.innerHTML="";
      section.classList.remove("is-lazy");
    }else{
      root.innerHTML=sectionPlaceholder(id);
      section.classList.add("is-lazy");
    }
  });

  SECTION_OBSERVER=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      const id=entry.target.id;
      renderSectionNow(id);
      SECTION_OBSERVER.unobserve(entry.target);
    });
  },{rootMargin:"280px 0px 280px 0px",threshold:0.01});

  Object.keys(renderers).forEach(id=>{
    const section=document.getElementById(id);
    if(!section)return;
    if(EAGER_SECTIONS.has(id)){
      renderSectionNow(id);
    }else{
      SECTION_OBSERVER.observe(section);
    }
  });

  const hashId=(location.hash||"").replace(/^#/,"");
  if(hashId&&renderers[hashId]){
    renderSectionNow(hashId);
    document.getElementById(hashId)?.scrollIntoView({block:"start"});
  }
}

    if(!id)return;
    renderSectionNow(id);
  });

  window.addEventListener("hashchange",()=>{
    const id=(location.hash||"").replace(/^#/,"");
    if(id)renderSectionNow(id);
  });
}

function abilityModFromStats(c,ability){
  const n=num(c?.stats?.[ability]);
  return n===null?null:Math.floor((n-10)/2);
}

function skillProficiencyState(s,c,ability){
  const explicit=norm(s.proficiency_level||s.proficiency||"");
  if(["expertise","expert","pericia","double"].includes(explicit))return "expert";
  if(explicit && !["none","no","false","0","untrained"].includes(explicit))return "proficient";

  const bonus=num(s.bonus||s.value);
  const base=abilityModFromStats(c,ability);
  const pb=num(c?.stats?.proficiency_bonus||c?.stats?.pb);

  if(bonus===null||base===null||pb===null||pb<=0)return "";
  const delta=bonus-base;
  if(delta>=pb*2)return "expert";
  if(delta>=pb)return "proficient";
  return "";
}

    const p=SK[norm(s.skill||s.name||"")];
    if(!p)return "";
    const state=skillProficiencyState(s,c,p[2]);
    const mark=state
      ? `<span class="skillMark ${p[0]==="sl"?"slm":"srm"} sk${p[1]} ${state==="expert"?"expert":""}" aria-hidden="true"></span>`
      : "";
    return `${mark}<span class="skill ${p[0]} sk${p[1]}">${esc(s.bonus||s.value||"")}</span>`;
  }).join("");
}

function saveOverlay(c){
  const rows=c.saves||[];
  const lookup=new Map(rows.map(s=>[
    String(s.ability||s.save||s.name||"").toUpperCase(),
    s
  ]));
  const abilities=["FUE","DES","CON","INT","SAB","CAR"];
  return abilities.map((k,i)=>{
    const s=lookup.get(k);
    if(!s)return "";
    return `<span class="saveMark sv${i+1}" aria-hidden="true"></span><span class="save sv${i+1}">${esc(s.bonus||s.value||"")}</span>`;
  }).join("");
}

function attackDisplay(a){
  const raw=a.name||a.attack||"";
  if(a.attack_bonus||a.damage||a.damage_type||a.range||a.properties){
    return{
      name:raw,
      bonus:a.attack_bonus||a.bonus||"",
      damage:a.damage||"",
      type:a.damage_type||"",
      range:a.range||"",
      props:a.properties||a.notes||""
    };
  }

  const m=raw.match(/^(.*?)\s([+-]\d+)\s+[—-]\s+(.+)$/);
  if(!m)return{name:raw,bonus:"",damage:"",type:"",range:"",props:""};

  let damage=m[3].trim(),type="";
  const dm=damage.match(/^([0-9dD+\-]+)\s*(.*)$/);
  if(dm){
    damage=dm[1];
    type=dm[2]||"";
  }
  return{name:m[1].trim(),bonus:m[2],damage,type,range:"",props:""};
}

function attackRows(c){
  return(c.attacks||[]).slice(0,5).map(a=>{
    const d=attackDisplay(a);
    return `<div class="atkrow tipTarget" ${tipAttr(a,"Ataque",c.name)}>
      <span class="fitText" data-max="8" data-min="5">${esc(d.name)}</span>
      <span class="fitText" data-max="8" data-min="5">${esc(d.bonus)}</span>
      <span class="fitText" data-max="8" data-min="5">${esc(d.damage)}</span>
      <span class="fitText" data-max="8" data-min="5">${esc(d.type)}</span>
      <span class="fitText" data-max="8" data-min="5">${esc(d.range)}</span>
      <span class="fitText" data-max="8" data-min="5">${esc(d.props)}</span>
    </div>`;
  }).join("");
}

function openChar(c){$("#modalTitle").textContent=c.name||"";const s=c.stats||{},g=traitGroups(c),langs=profList(c,"language"),profs=profList(c,"proficiency"),eq=c.equipment||[],saves=saveMap(c),template=assetValue(cfg("sheet_template_asset_id","AST_SHEET")),speed=s.speed_ft||s.speed||"",pb=s.proficiency_bonus||s.pb||"",portraitCls=(c.character_id==="ALLY_TOMAS"||norm(c.name)==="tomas")?"fullBodyPortrait":"";$("#sheet").innerHTML=`${template?img(template,"bg","Plantilla de hoja de personaje"):""}<div class="pic">${c.portrait?img(c.portrait,portraitCls,c.name):""}</div><span class="f f-name fitText" data-max="13" data-min="7">${esc(c.name||"")}</span><span class="f f-race fitText" data-max="13" data-min="7">${esc(c.race||"")}</span><span class="f f-class fitText" data-max="13" data-min="7">${esc(c.class||"")}</span><span class="f f-sub fitText" data-max="13" data-min="7">${esc(c.subclass||"")}</span><span class="f f-bg fitText" data-max="13" data-min="6">${esc(c.background||"")}</span><span class="f f-level">${esc(c.level||"")}</span><span class="f f-xp">${esc(c.xp||"")}</span><span class="f f-align fitText" data-max="13" data-min="7">${esc(c.alignment||"")}</span><span class="f f-pb">${pb?"+"+esc(pb):""}</span>${["str","dex","con","int","wis","cha"].map((a,i)=>`<span class="score a${i+1}">${esc(val(s[a]))}</span><span class="mod a${i+1}">${esc(mod(s[a]))}</span>`).join("")}<span class="pb">${pb?"+"+esc(pb):""}</span>${saveOverlay(c)}<span class="combat ac">${esc(val(s.ac))}</span><span class="combat ini">${num(s.initiative)!==null&&num(s.initiative)>=0?"+":""}${esc(val(s.initiative))}</span><span class="combat spd">${esc(val(speed))}</span><span class="combat hpm">${esc(val(s.hp_max))}</span><span class="combat hpc">${esc(val(s.hp_current))}</span><span class="combat hd fitText" data-max="20" data-min="9">${esc(val(s.hit_dice))}</span>${skillOverlay(c)}<div class="box raceBox fitBox" data-max="9" data-min="5">${techList(g.species,"Rasgo de especie",c.name)}</div><div class="box classBox fitBox" data-max="9" data-min="5">${techList(g.class,"Rasgo de clase",c.name)}</div><div class="box otherBox fitBox" data-max="9" data-min="5">${techList(g.other,"Dote / otro rasgo",c.name)}</div><div class="box langBox fitBox" data-max="8" data-min="5"><div class="langGroup"><b>Idiomas</b><br>${esc(langs.join(", ")||"—")}</div><div class="langGroup"><b>Herramientas y competencias</b><br>${esc(profs.join(" · ")||"—")}</div></div><div class="box attacks fitBox" data-max="9" data-min="5">${attackRows(c)}</div><div class="box equip fitBox" data-max="9" data-min="5">${techList(eq.slice(0,6),"Objeto",c.name)}</div><div class="box inv fitBox" data-max="9" data-min="5">${techList(eq.slice(6),"Objeto",c.name)}</div><div class="box notes fitBox" data-max="9" data-min="5">${esc(c.current_state||c.short_description||c.status||"")}</div>`;$("#side").innerHTML=`<div class="card"><div class="status">${esc(c.kind||"")} · ${esc(c.role||"")}</div><h3>${esc(c.name||"")}</h3><p class="long">${esc(c.short_description||c.description||"")}</p><span class="pill">${esc(c.race||"—")}</span><span class="pill">${esc([c.class,c.subclass].filter(Boolean).join(" — ")||"—")}</span><span class="pill">Nivel ${esc(c.level||"—")}</span></div><details open><summary>Historia conocida</summary><div class="body long">${esc(c.public_history||c.history||"—")}</div></details>${c.appearance?`<details><summary>Apariencia</summary><div class="body long">${esc(c.appearance)}</div></details>`:""}${c.personality?`<details><summary>Personalidad</summary><div class="body long">${esc(c.personality)}</div></details>`:""}<details open><summary>Mecánicas</summary><div class="body"><div class="mechanics"><div class="mini"><b>Atributos</b>FUE ${val(s.str)} (${mod(s.str)}) · DES ${val(s.dex)} (${mod(s.dex)}) · CON ${val(s.con)} (${mod(s.con)}) · INT ${val(s.int)} (${mod(s.int)}) · SAB ${val(s.wis)} (${mod(s.wis)}) · CAR ${val(s.cha)} (${mod(s.cha)})</div><div class="mini"><b>Combate</b>CA ${val(s.ac)} · iniciativa ${val(s.initiative)} · velocidad ${val(speed)} · PG ${val(s.hp_current)}/${val(s.hp_max)} · dados ${val(s.hit_dice)}</div><div class="mini"><b>Salvaciones</b>${Object.entries(saves).map(([a,b])=>`${a} ${b}`).join(" · ")||"—"}</div><div class="mini"><b>Habilidades</b>${(c.skills||[]).map(x=>`${x.skill||x.name} ${x.bonus||x.value||""}`).join(" · ")||"—"}</div></div></div></details><details open><summary>Rasgos de especie</summary><div class="body">${techList(g.species,"Rasgo de especie",c.name)}</div></details><details open><summary>Rasgos de clase</summary><div class="body">${techList(g.class,"Rasgo de clase",c.name)}</div></details>${g.other.length?`<details><summary>Dotes y otros rasgos</summary><div class="body">${techList(g.other,"Rasgo",c.name)}</div></details>`:""}<details><summary>Habilidades</summary><div class="body">${techList(c.skills,"Habilidad",c.name)}</div></details><details><summary>Idiomas y competencias</summary><div class="body"><h4>Idiomas</h4>${list(langs)}<h4>Competencias</h4>${list(profs)}</div></details>${c.spells.length?`<details><summary>Conjuros</summary><div class="body">${techList(c.spells,"Conjuro",c.name)}${c.spell_slots.length?`<h4>Espacios</h4>${list(c.spell_slots.map(x=>`Nivel ${x.spell_level}: ${x.slots_current}/${x.slots_max}`))}`:""}</div></details>`:""}<details><summary>Ataques</summary><div class="body">${techList(c.attacks,"Ataque",c.name)}</div></details><details><summary>Equipo e inventario</summary><div class="body">${techList(c.equipment,"Objeto",c.name)}</div></details>${c.relationships.length?`<details><summary>Relaciones</summary><div class="body">${list(c.relationships.map(r=>`${r.object_name||r.object_id||""}${r.public_summary?": "+r.public_summary:""}`))}</div></details>`:""}<details><summary>Estado actual</summary><div class="body long">${esc(c.current_state||c.status||"—")}</div></details>`;$("#modal").classList.add("open");document.body.style.overflow="hidden";queueImages($("#sheet"));requestAnimationFrame(()=>requestAnimationFrame(fitSheetText))}
function fitOne(el){const max=num(el.dataset.max)||parseFloat(getComputedStyle(el).fontSize)||12,min=num(el.dataset.min)||5;el.style.fontSize=max+"px";el.style.lineHeight="1.1";let size=max;const overflow=()=>el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;while(size>min&&overflow()){size-=.35;el.style.fontSize=size+"px";if(el.classList.contains("fitBox"))el.style.lineHeight=String(Math.max(.95,1.12-(max-size)*.015))}}function fitSheetText(){document.querySelectorAll("#sheet .fitText,#sheet .fitBox").forEach(fitOne)}
function showTip(data,e){const tip=$("#tip"),rows=(data.rows||[]).map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("");tip.innerHTML=`<div class="k">${esc(data.kind)}</div><h4>${esc(data.title)}</h4><p>${esc(data.desc||"")}</p>${rows?`<dl>${rows}</dl>`:""}`;tip.classList.add("show");positionTip(e)}function positionTip(e){const tip=$("#tip");if(!tip.classList.contains("show"))return;let x=e.clientX+15,y=e.clientY+15,b=tip.getBoundingClientRect();if(x+b.width>innerWidth-10)x=e.clientX-b.width-15;if(y+b.height>innerHeight-10)y=innerHeight-b.height-10;tip.style.left=Math.max(10,x)+"px";tip.style.top=Math.max(10,y)+"px"}
document.addEventListener("mouseover",e=>{const t=e.target.closest?.("[data-tip]");if(t)try{showTip(JSON.parse(t.dataset.tip),e)}catch{}});document.addEventListener("mousemove",positionTip);document.addEventListener("mouseout",e=>{if(e.target.closest?.("[data-tip]"))$("#tip").classList.remove("show")});document.addEventListener("focusin",e=>{const t=e.target.closest?.("[data-tip]");if(t)try{const r=t.getBoundingClientRect();showTip(JSON.parse(t.dataset.tip),{clientX:r.right,clientY:r.top})}catch{}});document.addEventListener("focusout",()=>$("#tip").classList.remove("show"));
async function refresh(){
  resetDiagnostics();
  addDiag(
    "info",
    "BUILD-ID",
    `Versión activa: ${BUILD_ID}`,
    "Si el diagnóstico muestra otra versión o el antiguo modo de rango fijo, el navegador está ejecutando un HTML anterior.",
    location.href,
    "build-id"
  );
  try{
    $("#refresh").disabled=true;
    DB=await loadDB();
    DATA=build(DB);
    renderAll();

    const failedTabs=Object.entries(TAB_STATUS).filter(([,v])=>!v.ok).length;
    const imageRefs=[...document.querySelectorAll("img")].length;

    $("#mode").textContent=failedTabs
      ? `Sheet parcial · ${failedTabs} pestaña(s) con error`
      : "Sheet vivo · "+new Date().toLocaleTimeString();
    $("#mode").className=failedTabs?"badge err":"badge live";

    if(!failedTabs){
      const schemaFailures=Object.entries(TAB_STATUS).filter(([,v])=>v.schemaOk===false).length;
      addDiag("info","SHEET-OK","MASTER leído y esquemas validados",
        `${Object.keys(TAB_STATUS).length} pestañas consultadas · ${schemaFailures} fallos de esquema · ${ASSETS.size} assets resueltos · ${imageRefs} imágenes insertadas en el DOM.`,
        `Sheet ID: ${SHEET_ID}\nCarga de datos: auto-header (headers=1 → retry headers=0)`,"sheet-ok");
    }

    clearInterval(TIMER);
    TIMER=setInterval(refresh,Math.max(15,num(cfg("refresh_seconds",60))||60)*1000);
  }catch(e){
    console.error(e);
    addDiag(
      "error",
      e?.diagCode||"APP-INIT",
      e?.diagTitle||"No se pudo inicializar el sitio",
      e?.diagDetail||String(e?.message||e),
      e?.diagContext||`Sheet ID: ${SHEET_ID}`,
      `fatal:${e?.diagCode||String(e?.message||e)}`
    );
    $("#mode").textContent="Error de Sheet";
    $("#mode").className="badge err";
    $("#main").innerHTML=`<section><div class="panel" style="padding:20px">
      <h2>No se pudo leer la base de datos</h2>
      <p><b>${esc(e?.diagCode||"APP-INIT")}</b></p>
      <p>${esc(e.message||e)}</p>
      <p>Abre <b>Diagnóstico</b> arriba para ver el detalle técnico.</p>
    </div></section>`;
  }finally{
    $("#refresh").disabled=false;
    renderDiagnostics();
  }
}
$("#refresh").onclick=refresh;
$("#diagToggle").onclick=()=>{
  const p=$("#diagPanel");
  p.hidden=!p.hidden;
  if(!p.hidden)renderDiagnostics();
};
$("#diagClose").onclick=()=>{$("#diagPanel").hidden=true};
$("#diagCopy").onclick=async()=>{
  const text=diagnosticReport();
  try{
    await navigator.clipboard.writeText(text);
    $("#diagCopy").textContent="Copiado";
    setTimeout(()=>$("#diagCopy").textContent="Copiar informe",1200);
  }catch{
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy")}catch{}
    ta.remove();
  }
};

window.addEventListener("error",e=>{
  if(e.target&&e.target.tagName==="IMG")return;
  addDiag(
    "error","JS-RUNTIME","Error de JavaScript en ejecución",
    e.message||"Error desconocido",
    `${e.filename||location.href}:${e.lineno||"?"}:${e.colno||"?"}`,
    `js:${e.message}:${e.lineno}:${e.colno}`
  );
});

window.addEventListener("unhandledrejection",e=>{
  const msg=String(e.reason?.message||e.reason||"Promesa rechazada");
  addDiag("error","JS-PROMISE","Error asíncrono no controlado",msg,location.href,`promise:${msg}`);
});

$("#close").onclick=()=>{$("#modal").classList.remove("open");document.body.style.overflow=""};$("#modal").onclick=e=>{if(e.target.id==="modal")$("#close").click()};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#close").click()});window.addEventListener("resize",()=>{if($("#modal").classList.contains("open"))fitSheetText()});refresh();
