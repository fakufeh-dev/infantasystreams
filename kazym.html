function parseCSV(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++;continue}if(x==='"'){q=!q;continue}if(x===","&&!q){r.push(c);c="";continue}if((x==="\n"||x==="\r")&&!q){if(x==="\r"&&n==="\n")i++;r.push(c);if(r.some(v=>v.trim()))R.push(r);r=[];c="";continue}c+=x}r.push(c);if(r.some(v=>v.trim()))R.push(r);return R}
function objects(rows){if(!rows.length)return[];let hi=0,b=-1;for(let i=0;i<Math.min(5,rows.length);i++){const n=rows[i].filter(x=>String(x).trim()).length;if(n>b){b=n;hi=i}}const h=rows[hi].map(x=>String(x).trim());return rows.slice(hi+1).filter(r=>r.some(x=>String(x).trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??""]).filter(([k])=>k)))}

function driveId(v){
  const s=String(v||"").trim();
  if(/^[A-Za-z0-9_-]{20,}$/.test(s))return s;
  let m=s.match(/\/d\/([A-Za-z0-9_-]{20,})/);
  if(m)return m[1];
  m=s.match(/[?&]id=([A-Za-z0-9_-]{20,})/);
  return m?m[1]:"";
}

function img(v,cls="",alt=""){
  const raw=String(v||"").trim();
  if(!raw)return"";
  const id=driveId(raw);
  if(id){
    const preview=`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
    return `<iframe class="driveFrame ${esc(cls)}" src="${esc(preview)}" title="${esc(alt||"Imagen")}" loading="lazy" sandbox="allow-scripts allow-same-origin" allow="autoplay; fullscreen"></iframe>`;

  if(/^https?:/i.test(raw))
    return `<img class="externalImg ${esc(cls)}" src="${esc(raw)}" alt="${esc(alt)}" loading="lazy">`;
  return"";
}

point[r.key]=r.value});else checkpoint=(db.checkpoint||[])[0]||{};return{characters,history,npcs,bestiary,items,base,checkpoint,lore:(db.lore||[]).sort(order),mysteries:(db.mysteries||[]).sort(order),rules:(db.rules||[]).sort(order),changelog:db.changelog||[],history_rolls:db.history_rolls||[],enemy_traits:group(db.enemy_traits,"enemy_id")}}

function tipData(o,k,owner=""){o=o||{};const title=o.name||o.item||o.skill||o.title||"",desc=o.technical_details||o.description||o.notes||o.public_summary||title,rows=[];[["Bonificador",o.bonus||o.attack_bonus],["Daño",o.damage],["Tipo",o.damage_type||o.type],["Acción",o.action_type],["Alcance",o.range],["Duración",o.duration],["Concentración",o.concentration],["Usos",o.uses],["Recarga",o.recharge],["Estado",o.status],["Fuente",o.source||o.source_book]].forEach(p=>{if(p[1])rows.push(p)});if(owner)rows.push(["Personaje",owner]);return{kind:k,title,desc,rows}}function tipAttr(o,k,owner=""){return`data-tip='${esc(JSON.stringify(tipData(o,k,owner)))}' tabindex="0"`}function techList(a,k,owner=""){return`<ul class="list">${(a||[]).map(x=>`<li class="tipTarget tipDot" ${tipAttr(x,k,owner)}>${esc(typeof x==="string"?x:(x.name||x.item||x.skill||x.title||""))}</li>`).join("")}</ul>`}

function traitGroups(c){const o={species:[],class:[],other:[]};(c.traits||[]).forEach(t=>{const k=norm(t.category||t.trait_type);if(k==="species"||k==="race")o.species.push(t);else if(k==="class")o.class.push(t);else o.other.push(t)});return o}function saveMap(c){return Object.fromEntries((c.saves||[]).map(s=>[String(s.ability||s.save||s.name||"").toUpperCase(),s.bonus||s.value||""]))}function profList(c,k){return(c.proficiencies||[]).filter(x=>norm(x.category)===k).map(x=>x.name||x.proficiency||"")}
const SK={"acrobacias":["sl",1],"atletismo":["sl",2],"arcanos":["sl",4],"engano":["sl",5],"historia":["sl",6],"interpretacion":["sl",7],"intimidacion":["sl",8],"investigacion":["sl",9],"medicina":["sr",1],"naturaleza":["sr",2],"percepcion":["sr",3],"perspicacia":["sr",4],"juego de manos":["sr",5],"sigilo":["sr",6],"supervivencia":["sr",7],"trato con animales":["sr",8]};function skillOverlay(c){return(c.skills||[]).map(s=>{const p=SK[norm(s.skill||s.name||"")];return p?`<span class="skill ${p[0]} sk${p[1]}">${esc(s.bonus||s.value||"")}</span>`:""}).join("")}function saveOverlay(c){const s=saveMap(c),a=["FUE","DES","CON","INT","SAB","CAR"];return a.map((k,i)=>s[k]?`<span class="save sv${i+1}">${esc(s[k])}</span>`:"").join("")}
function attackDisplay(a){const name=a.name||a.attack||"";if(a.attack_bonus||a.damage)return{name,bonus:a.attack_bonus||a.bonus||"",damage:a.damage||"",type:a.damage_type||"",props:a.range||a.properties||""};const m=name.match(/^(.*?)\s([+-]\d+)\s+[—-]\s+(.+)$/);return{name:m?m[1]:name,bonus:m?m[2]:"",damage:m?m[3]:"",type:"",props:""}}function attackRows(c){return(c.attacks||[]).slice(0,4).map(a=>{const d=attackDisplay(a);return`<div class="atkrow tipTarget" ${tipAttr(a,"Ataque",c.name)}><span class="fitText">${esc(d.name)}</span><span class="fitText">${esc(d.bonus)}</span><span class="fitText">${esc(d.damage)}</span><span class="fitText">${esc(d.type)}</span><span class="fitText">${esc(d.props)}</span></div>`}).join("")}
function openChar(c){$("#modalTitle").textContent=c.name||"";const s=c.stats||{},g=traitGroups(c),langs=profList(c,"language"),profs=profList(c,"proficiency"),eq=c.equipment||[],saves=saveMap(c),template=assetValue(cfg("sheet_template_asset_id","AST_SHEET")),speed=s.speed_ft||s.speed||"",pb=s.proficiency_bonus||s.pb||"";$("#sheet").innerHTML=`${template?img(template,"bg","Plantilla de hoja de personaje"):""}<div class="pic">${c.portrait?img(c.portrait,"",c.name):""}</div><span class="f f-name fitText" data-max="13" data-min="7">${esc(c.name||"")}</span><span class="f f-race fitText" data-max="13" data-min="7">${esc(c.race||"")}</span><span class="f f-class fitText" data-max="13" data-min="7">${esc(c.class||"")}</span><span class="f f-sub fitText" data-max="13" data-min="7">${esc(c.subclass||"")}</span><span class="f f-bg fitText" data-max="13" data-min="6">${esc(c.background||"")}</span><span class="f f-level">${esc(c.level||"")}</span><span class="f f-xp">${esc(c.xp||"")}</span><span class="f f-align fitText" data-max="13" data-min="7">${esc(c.alignment||"")}</span><span class="f f-pb">${pb?"+"+esc(pb):""}</span>${["str","dex","con","int","wis","cha"].map((a,i)=>`<span class="score a${i+1}">${esc(val(s[a]))}</span><span class="mod a${i+1}">${esc(mod(s[a]))}</span>`).join("")}<span class="pb">${pb?"+"+esc(pb):""}</span>${saveOverlay(c)}<span class="combat ac">${esc(val(s.ac))}</span><span class="combat ini">${num(s.initiative)!==null&&num(s.initiative)>=0?"+":""}${esc(val(s.initiative))}</span><span class="combat spd">${esc(val(speed))}</span><span class="combat hpm">${esc(val(s.hp_max))}</span><span class="combat hpc">${esc(val(s.hp_current))}</span><span class="combat hd fitText" data-max="20" data-min="9">${esc(val(s.hit_dice))}</span>${skillOverlay(c)}<div class="box raceBox fitBox" data-max="9" data-min="5">${techList(g.species,"Rasgo de especie",c.name)}</div><div class="box classBox fitBox" data-max="9" data-min="5">${techList(g.class,"Rasgo de clase",c.name)}</div><div class="box otherBox fitBox" data-max="9" data-min="5">${techList(g.other,"Dote / otro rasgo",c.name)}</div><div class="box langBox fitBox" data-max="9" data-min="5"><b>Idiomas</b><br>${esc(langs.join(", ")||"—")}<br><br><b>Competencias</b><br>${esc(profs.join("; ")||"—")}</div><div class="box attacks fitBox" data-max="9" data-min="5">${attackRows(c)}</div><div class="box equip fitBox" data-max="9" data-min="5">${techList(eq.slice(0,6),"Objeto",c.name)}</div><div class="box inv fitBox" data-max="9" data-min="5">${techList(eq.slice(6),"Objeto",c.name)}</div><div class="box notes fitBox" data-max="9" data-min="5">${esc(c.current_state||c.short_description||c.status||"")}</div>`;$("#side").innerHTML=`<div class="card"><div class="status">${esc(c.kind||"")} · ${esc(c.role||"")}</div><h3>${esc(c.name||"")}</h3><p class="long">${esc(c.short_description||c.description||"")}</p><span class="pill">${esc(c.race||"—")}</span><span class="pill">${esc([c.class,c.subclass].filter(Boolean).join(" — ")||"—")}</span><span class="pill">Nivel ${esc(c.level||"—")}</span></div><details open><summary>Historia conocida</summary><div class="body long">${esc(c.public_history||c.history||"—")}</div></details>${c.appearance?`<details><summary>Apariencia</summary><div class="body long">${esc(c.appearance)}</div></details>`:""}${c.personality?`<details><summary>Personalidad</summary><div class="body long">${esc(c.personality)}</div></details>`:""}<details open><summary>Mecánicas</summary><div class="body"><div class="mechanics"><div class="mini"><b>Atributos</b>FUE ${val(s.str)} (${mod(s.str)}) · DES ${val(s.dex)} (${mod(s.dex)}) · CON ${val(s.con)} (${mod(s.con)}) · INT ${val(s.int)} (${mod(s.int)}) · SAB ${val(s.wis)} (${mod(s.wis)}) · CAR ${val(s.cha)} (${mod(s.cha)})</div><div class="mini"><b>Combate</b>CA ${val(s.ac)} · iniciativa ${val(s.initiative)} · velocidad ${val(speed)} · PG ${val(s.hp_current)}/${val(s.hp_max)} · dados ${val(s.hit_dice)}</div><div class="mini"><b>Salvaciones</b>${Object.entries(saves).map(([a,b])=>`${a} ${b}`).join(" · ")||"—"}</div><div class="mini"><b>Habilidades</b>${(c.skills||[]).map(x=>`${x.skill||x.name} ${x.bonus||x.value||""}`).join(" · ")||"—"}</div></div></div></details><details open><summary>Rasgos de especie</summary><div class="body">${techList(g.species,"Rasgo de especie",c.name)}</div></details><details open><summary>Rasgos de clase</summary><div class="body">${techList(g.class,"Rasgo de clase",c.name)}</div></details>${g.other.length?`<details><summary>Dotes y otros rasgos</summary><div class="body">${techList(g.other,"Rasgo",c.name)}</div></details>`:""}<details><summary>Habilidades</summary><div class="body">${techList(c.skills,"Habilidad",c.name)}</div></details><details><summary>Idiomas y competencias</summary><div class="body"><h4>Idiomas</h4>${list(langs)}<h4>Competencias</h4>${list(profs)}</div></details>${c.spells.length?`<details><summary>Conjuros</summary><div class="body">${techList(c.spells,"Conjuro",c.name)}${c.spell_slots.length?`<h4>Espacios</h4>${list(c.spell_slots.map(x=>`Nivel ${x.spell_level}: ${x.slots_current}/${x.slots_max}`))}`:""}</div></details>`:""}<details><summary>Ataques</summary><div class="body">${techList(c.attacks,"Ataque",c.name)}</div></details><details><summary>Equipo e inventario</summary><div class="body">${techList(c.equipment,"Objeto",c.name)}</div></details>${c.relationships.length?`<details><summary>Relaciones</summary><div class="body">${list(c.relationships.map(r=>`${r.object_name||r.object_id||""}${r.public_summary?": "+r.public_summary:""}`))}</div></details>`:""}<details><summary>Estado actual</summary><div class="body long">${esc(c.current_state||c.status||"—")}</div></details>`;$("#modal").classList.add("open");document.body.style.overflow="hidden";queueImages($("#sheet"));requestAnimationFrame(()=>requestAnimationFrame(fitSheetText))}
function fitOne(el){const max=num(el.dataset.max)||parseFloat(getComputedStyle(el).fontSize)||12,min=num(el.dataset.min)||5;el.style.fontSize=max+"px";el.style.lineHeight="1.1";let size=max;const overflow=()=>el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;while(size>min&&overflow()){size-=.35;el.style.fontSize=size+"px";if(el.classList.contains("fitBox"))el.style.lineHeight=String(Math.max(.95,1.12-(max-size)*.015))}}function fitSheetText(){document.querySelectorAll("#sheet .fitText,#sheet .fitBox").forEach(fitOne)}
function showTip(data,e){const tip=$("#tip"),rows=(data.rows||[]).map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("");tip.innerHTML=`<div class="k">${esc(data.kind)}</div><h4>${esc(data.title)}</h4><p>${esc(data.desc||"")}</p>${rows?`<dl>${rows}</dl>`:""}`;tip.classList.add("show");positionTip(e)}function positionTip(e){const tip=$("#tip");if(!tip.classList.contains("show"))return;let x=e.clientX+15,y=e.clientY+15,b=tip.getBoundingClientRect();if(x+b.width>innerWidth-10)x=e.clientX-b.width-15;if(y+b.height>innerHeight-10)y=innerHeight-b.height-10;tip.style.left=Math.max(10,x)+"px";tip.style.top=Math.max(10,y)+"px"}
document.addEventListener("mouseover",e=>{const t=e.target.closest?.("[data-tip]");if(t)try{showTip(JSON.parse(t.dataset.tip),e)}catch{}});document.addEventListener("mousemove",positionTip);document.addEventListener("mouseout",e=>{if(e.target.closest?.("[data-tip]"))$("#tip").classList.remove("show")});document.addEventListener("focusin",e=>{const t=e.target.closest?.("[data-tip]");if(t)try{const r=t.getBoundingClientRect();showTip(JSON.parse(t.dataset.tip),{clientX:r.right,clientY:r.top})}catch{}});document.addEventListener("focusout",()=>$("#tip").classList.remove("show"));
async function refresh(){try{$("#refresh").disabled=true;DB=await loadDB();DATA=build(DB);renderAll();$("#mode").textContent="Sheet vivo · "+new Date().toLocaleTimeString();$("#mode").className="badge live";clearInterval(TIMER);TIMER=setInterval(refresh,Math.max(15,num(cfg("refresh_seconds",60))||60)*1000)}catch(e){console.error(e);$("#mode").textContent="Error de Sheet";$("#mode").className="badge err";$("#main").innerHTML=`<section><div class="panel" style="padding:20px"><h2>No se pudo leer la base de datos</h2><p>${esc(e.message)}</p></div></section>`}finally{$("#refresh").disabled=false}}
$("#refresh").onclick=refresh;$("#close").onclick=()=>{$("#modal").classList.remove("open");document.body.style.overflow=""};$("#modal").onclick=e=>{if(e.target.id==="modal")$("#close").click()};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#close").click()});window.addEventListener("resize",()=>{if($("#modal").classList.contains("open"))fitSheetText()});refresh();
